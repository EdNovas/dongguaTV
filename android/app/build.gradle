apply plugin: 'com.android.application'

// [adult] 私有签名(可选):只从本机用户目录的 gradle.properties 读(GRADLE_USER_HOME 或 ~/.gradle/gradle.properties),
//   绝不从仓库里的 android/gradle.properties / -P 读。四项都设了、密钥文件存在、且不在仓库目录里,release 才签名;
//   缺一项 = 不配签名,assembleRelease 照旧出 app-release-unsigned.apk(手动 zipalign + apksigner)。
//   DGX_STORE_FILE / DGX_STORE_PASSWORD / DGX_KEY_ALIAS / DGX_KEY_PASSWORD;步骤见 .adult-research/impl/p4/android-build.md
def dgxSigning = { ->
    def home = System.getenv('GRADLE_USER_HOME') ?: new File(System.getProperty('user.home'), '.gradle').path
    def f = new File(home, 'gradle.properties')
    if (!f.isFile()) return null
    def p = new Properties()
    f.withInputStream { p.load(it) }
    def keys = ['DGX_STORE_FILE', 'DGX_STORE_PASSWORD', 'DGX_KEY_ALIAS', 'DGX_KEY_PASSWORD']
    if (!keys.every { (p.getProperty(it) ?: '').trim() }) return null
    def store = new File(p.getProperty('DGX_STORE_FILE').trim())
    if (!store.isFile()) { logger.warn("[dgx] DGX_STORE_FILE 不存在: ${store} —— 不签名"); return null }
    def repo = rootProject.projectDir.parentFile.canonicalFile
    if (store.canonicalPath.startsWith(repo.canonicalPath + File.separator)) { logger.warn('[dgx] 签名密钥在仓库目录里 —— 拒绝使用,挪到仓库外'); return null }
    return [store: store, storePassword: p.getProperty('DGX_STORE_PASSWORD'), alias: p.getProperty('DGX_KEY_ALIAS').trim(), keyPassword: p.getProperty('DGX_KEY_PASSWORD')]
}()

android {
    namespace = "com.ednovas.donguatv"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.private.dgx"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // 支持所有 CPU 架构
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    if (dgxSigning) {
        signingConfigs {
            release {
                storeFile dgxSigning.store
                storePassword dgxSigning.storePassword
                keyAlias dgxSigning.alias
                keyPassword dgxSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (dgxSigning) signingConfig signingConfigs.release
        }
    }
    
    // 按架构分包构建 (可选：生成单独的架构 APK)
    // 注释掉 splits 块可生成包含所有架构的单一 APK (universal)
    /*
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true  // 同时生成包含所有架构的通用 APK
        }
    }
    */
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
