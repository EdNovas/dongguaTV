                    <!-- ======================= 🗂️ 片库(片名索引) ======================= -->
                    <section v-show="tab === 'library'" class="sec" aria-label="片库">
                        <p class="since">有些资源站把关键词搜索关了(搜什么都回「暂不支持搜索」)，但片单还能翻。服务器会把这些站的片名表爬到本地，搜索时先在本地找出片子，再去资源站取详情，这样它们的线路也会出现在搜索结果里。每天自动检查一次哪些站关了搜索；第一次全量要翻几千页，每站约 1~2 小时。</p>
                        <load-state :st="ti" :has="!!ti.data" @retry="loadTitleIndex"></load-state>
                        <template v-if="ti.data">
                            <div v-if="!ti.data.available" class="empty">服务器没启用片名索引(Vercel 部署或设了 TITLE_INDEX_DISABLE=1)。</div>
                            <template v-else>
                                <div class="kpis" style="margin-bottom:12px">
                                    <div class="kpi"><div class="k-l">走索引的站</div><div class="k-v">{{ tiStats.active }} / {{ tiStats.nosearch }}</div><div class="k-s">正在用 / 关了搜索</div></div>
                                    <div class="kpi"><div class="k-l">已收录片名</div><div class="k-v">{{ fmtNum(tiStats.rows) }}</div><div class="k-s">资源站共 {{ fmtNum(tiStats.total) }}</div></div>
                                    <div class="kpi"><div class="k-l">搜索正常的站</div><div class="k-v">{{ tiStats.ok }}</div><div class="k-s">不用建索引</div></div>
                                    <div class="kpi"><div class="k-l">未确认</div><div class="k-v">{{ tiStats.unknown }}</div><div class="k-s">打不开 / 限海外，2 小时后再探</div></div>
                                </div>
                                <div class="toolbar">
                                    <button type="button" class="btn btn-sm" :disabled="ti.busy.all" @click="tiAct('probe', '')">全部重新探测</button>
                                    <label class="muted" style="font-size:13px"><input type="checkbox" v-model="ti.showAll"> 也显示其他站(搜索正常 / 未确认)</label>
                                    <span class="muted count">{{ ti.data.running ? '后台正在爬…' : '后台空闲(每分钟一轮)' }}</span>
                                </div>
                                <div class="panel p0 table-wrap" :class="{ dim: ti.loading }">
                                    <table class="tbl">
                                        <thead><tr><th>资源站</th><th>状态</th><th class="num">已收录 / 资源站总数</th><th>进度</th><th>最近</th><th>操作</th></tr></thead>
                                        <tbody>
                                            <tr v-for="s in tiRows" :key="s.key">
                                                <td><div>{{ s.name }}</div><div class="sub">{{ s.key }}<template v-if="!s.configured"> · 已从站点表移除</template></div></td>
                                                <td>
                                                    <span class="badge" :class="(K.TI_MODE[s.mode] || K.TI_MODE.unknown)[1]">{{ (K.TI_MODE[s.mode] || K.TI_MODE.unknown)[0] }}</span>
                                                    <span v-if="s.paused" class="badge b-unk" style="margin-left:4px">已暂停</span>
                                                    <span v-if="s.override !== 'auto' || s.forced" class="badge b-unk" style="margin-left:4px" :title="s.forced ? 'db.json 里写了 search 字段' : '后台手动指定'">{{ (s.forced || s.override) === 'index' ? '强制索引' : '强制不走' }}</span>
                                                    <div class="sub" :title="s.probe_note">探测 {{ s.probed_at ? fmtRel(s.probed_at) : '还没探' }}</div>
                                                </td>
                                                <td class="num"><div>{{ fmtNum(s.rows) }}</div><div class="sub">{{ s.total ? fmtNum(s.total) : '—' }}</div></td>
                                                <td>
                                                    <template v-if="s.mode === 'nosearch'">
                                                        <div v-if="s.full_done" class="sub">全量完成 {{ fmtRel(s.full_done) }}</div>
                                                        <div v-else class="sub">全量 第 {{ fmtNum(Math.max(0, s.full_pg - 1)) }} / {{ s.pagecount ? fmtNum(s.pagecount) : '?' }} 页</div>
                                                        <div class="ti-prog"><i :style="{ width: tiPct(s) + '%' }"></i></div>
                                                    </template>
                                                    <span v-else class="muted">—</span>
                                                </td>
                                                <td>
                                                    <div class="sub" v-if="s.inc_at">增量 {{ fmtRel(s.inc_at) }}</div>
                                                    <div v-if="s.last_err" class="ti-err" :title="s.last_err">失败 {{ s.fails }} 次：{{ s.last_err }}</div>
                                                    <div v-if="s.next_at > ti.data.now" class="sub">{{ fmtRel(s.next_at) }}重试</div>
                                                </td>
                                                <td>
                                                    <div class="ti-acts">
                                                        <button type="button" class="btn btn-sm" :disabled="ti.busy[s.key]" @click="tiAct('probe', s.key)">探测</button>
                                                        <button v-if="s.mode === 'nosearch'" type="button" class="btn btn-sm" :disabled="ti.busy[s.key]" @click="tiAct('rebuild', s.key)">重新全量</button>
                                                        <button v-if="s.mode === 'nosearch'" type="button" class="btn btn-sm" :disabled="ti.busy[s.key]" @click="tiAct(s.paused ? 'resume' : 'pause', s.key)">{{ s.paused ? '继续' : '暂停' }}</button>
                                                        <button v-if="s.fails" type="button" class="btn btn-sm" :disabled="ti.busy[s.key]" @click="tiAct('retry', s.key)">立刻重试</button>
                                                        <button v-if="s.override === 'auto' && s.mode !== 'nosearch'" type="button" class="btn btn-sm" :disabled="ti.busy[s.key]" @click="tiAct('force-index', s.key)" title="自动探测判错时用:这个站其实搜不到">强制走索引</button>
                                                        <button v-if="s.override === 'auto' && s.mode === 'nosearch' && !s.forced" type="button" class="btn btn-sm" :disabled="ti.busy[s.key]" @click="tiAct('force-off', s.key)">不走索引</button>
                                                        <button v-if="s.override !== 'auto'" type="button" class="btn btn-sm" :disabled="ti.busy[s.key]" @click="tiAct('auto', s.key)">恢复自动</button>
                                                        <button v-if="s.rows" type="button" class="btn btn-sm btn-danger-ghost" :disabled="ti.busy[s.key]" @click="tiAct('clear', s.key)">清空</button>
                                                    </div>
                                                </td>
                                            </tr>
                                            <tr v-if="!tiRows.length"><td colspan="6" class="empty">还没有关了搜索的站{{ ti.data.sites.length ? '' : '(第一轮探测在服务器启动 90 秒后)' }}</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div class="ti-try">
                                    <select v-model="ti.trySite" aria-label="试搜的资源站">
                                        <option value="">选一个走索引的站</option>
                                        <option v-for="s in ti.data.sites.filter(x => x.rows)" :key="s.key" :value="s.key">{{ s.name }}</option>
                                    </select>
                                    <input v-model="ti.tryQ" type="search" placeholder="输入片名试搜(只查本地索引)" @keydown.enter.prevent="tiTry">
                                    <button type="button" class="btn btn-sm btn-primary" :disabled="!ti.trySite || !ti.tryQ.trim() || ti.tryBusy" @click="tiTry">试搜</button>
                                </div>
                                <ul v-if="ti.tryRes" class="ti-hits">
                                    <li v-for="h in ti.tryRes" :key="h.vod_id">{{ h.name }} <span class="muted">· {{ h.tname }} · id {{ h.vod_id }}</span></li>
                                    <li v-if="!ti.tryRes.length" class="muted" style="list-style:none">本地索引里没找到</li>
                                </ul>
                            </template>
                        </template>
                    </section>

                    <!-- ======================= 🤖 AI 模型 ======================= -->
                    <section v-show="tab === 'ai'" class="sec" aria-label="AI 模型">
                        <p class="since">「描述找片」「截图找片」和搜索框的语音输入都走 Cloudflare Workers AI。这里是 Cloudflare 现有的模型(服务器每天自动同步一次)，配上我们自己的找片测评和评级；在「正在使用」里决定实际用哪几个、按什么顺序兜底。</p>
                        <load-state :st="ai" :has="!!ai.data" label="加载模型列表" @retry="loadAi"></load-state>
                        <template v-if="ai.data">
                            <div v-if="!ai.data.enabled" class="note-banner warn">AI 功能没启用：服务器要设置环境变量 <code>CF_AI_ACCOUNT_ID</code>(Cloudflare 账户 ID)和 <code>CF_AI_TOKEN</code>(带 Workers AI 权限的 API 令牌)，重启后生效。没启用时也可以先在这里选好模型，启用后按这里的设置跑。</div>
                            <div v-if="ai.data.catalogErr && (ai.data.enabled || ai.data.models.length)" class="note-banner warn">同步模型列表失败：{{ ai.data.catalogErr }}<template v-if="ai.data.catalogAt">。下面是 {{ fmtRel(ai.data.catalogAt) }}同步的列表。</template></div>
                            <div class="kpis">
                                <div class="kpi" :class="{ warn: !ai.data.enabled }"><div class="k-l">状态</div><div class="k-v">{{ ai.data.enabled ? '已启用' : '未启用' }}</div><div class="k-s">Cloudflare Workers AI</div></div>
                                <div class="kpi" :class="{ warn: aiUsagePct >= 90 }">
                                    <div class="k-l">今日调用</div>
                                    <div class="k-v">{{ fmtNum(ai.data.usage.count) }}<span class="k-u"> / {{ ai.data.usage.limit ? fmtNum(ai.data.usage.limit) : '不限' }}</span></div>
                                    <div v-if="ai.data.usage.limit" class="ti-prog" role="progressbar" :aria-valuenow="aiUsagePct" aria-valuemin="0" aria-valuemax="100" aria-label="今日调用占上限"><i :style="{ width: aiUsagePct + '%' }"></i></div>
                                    <div class="k-s">{{ ai.data.usage.day ? '北京时间 ' + ai.data.usage.day : '按北京时间算' }} · 含测评</div>
                                </div>
                                <div class="kpi"><div class="k-l">可用模型</div><div class="k-v">{{ aiCounts.usable }}</div><div class="k-s">文字 {{ aiCounts.text }} · 看图 {{ aiCounts.image }} · 语音 {{ aiCounts.asr }}</div></div>
                                <div class="kpi"><div class="k-l">已测评</div><div class="k-v">{{ aiCounts.bench }}</div><div class="k-s">{{ aiCounts.untested ? '新模型 ' + aiCounts.untested + ' 个还没测' : '没有待测的新模型' }}</div></div>
                                <div class="kpi"><div class="k-l">测评推荐</div><div class="k-v sm wrapany">{{ aiShort(ai.data.recommended.text) || '—' }}</div><div class="k-s">截图 {{ aiShort(ai.data.recommended.image) || '—' }} · 性价比 {{ aiShort(ai.data.recommended.value) || '—' }}</div></div>
                                <div class="kpi" :class="{ warn: !!ai.data.catalogErr }"><div class="k-l">模型列表</div><div class="k-v sm" :title="fmtAbs(ai.data.catalogAt)">{{ ai.data.catalogAt ? fmtRel(ai.data.catalogAt) + '同步' : '还没同步' }}</div><div class="k-s">{{ ai.data.catalogErr ? '上次同步失败' : '每天自动同步' }}</div></div>
                            </div>
                            <div class="toolbar">
                                <button type="button" class="btn btn-sm" :disabled="ai.busy.refresh" @click="aiRefresh">{{ ai.busy.refresh ? '同步中…' : '↻ 刷新模型列表' }}</button>
                                <span class="muted" style="font-size:12.5px">立刻从 Cloudflare 拉一次；新出现的模型标「新」，不在列表里的标「已下架」</span>
                            </div>

                            <!-- 测评进度 -->
                            <div v-if="aiRunning" class="note-banner info ai-run" role="status">
                                <span class="spin" aria-hidden="true"></span>
                                <div class="ai-run-b">
                                    <div>
                                        <template v-if="ai.data.bench.running">正在测评 <b>{{ aiShort(ai.data.bench.running) }}</b><template v-if="ai.data.bench.progress"> · {{ ai.data.bench.progress.done }} / {{ ai.data.bench.progress.total }}</template></template>
                                        <template v-else>准备测评…</template>
                                        <template v-if="aiQueue.length"> · 还在排队 {{ aiQueue.length }} 个：{{ aiQueue.map(aiShort).join('、') }}</template>
                                    </div>
                                    <div v-if="ai.data.bench.progress" class="ti-prog" style="max-width:420px"><i :style="{ width: aiProgPct + '%' }"></i></div>
                                    <div class="sub">每 2 秒自动刷新进度；切到别的分区就停止刷新(测评在服务器上照常跑)，测评用掉的次数算进今日调用。</div>
                                </div>
                            </div>

                            <div v-if="!ai.data.models.length" class="panel empty">{{ ai.data.enabled ? '还没有模型列表：点上面「刷新模型列表」从 Cloudflare 拉一次。' : '配好 Workers AI 并重启后，这里会列出 Cloudflare 的模型、测评评级，并能挑选实际用哪个。' }}</div>
                            <template v-else>
                            <!-- 正在使用 -->
                            <div class="panel">
                                <div class="panel-h">
                                    <h2>正在使用</h2>
                                    <span class="muted">从上往下依次尝试：出错或答得不好就换下一个</span>
                                    <span class="sp"></span>
                                    <span v-if="aiDirty" class="badge b-soon">有未保存的修改</span>
                                    <span v-else-if="aiUsingDefaults" class="badge b-unk">还没改过，用的是默认推荐</span>
                                </div>
                                <div class="ai-roles">
                                    <div v-for="r in aiRoles" :key="r.id" class="ai-role">
                                        <h3>{{ r.label }} <span class="muted">{{ r.hint }}</span></h3>
                                        <template v-if="r.max > 1">
                                            <ol class="ai-slots">
                                                <li v-for="(n, i) in ai.draft[r.id]" :key="n" class="ai-slot" :class="{ bad: !!aiSlotWarn(n) }">
                                                    <span class="si" :class="{ p: i === 0 }">{{ i === 0 ? '主' : '备 ' + i }}</span>
                                                    <span class="sn">
                                                        <b :title="n">{{ aiShort(n) }}</b>
                                                        <span class="sm">

                            <details class="panel ai-how">
                                <summary>评级怎么算的</summary>
                                <ul>
                                    <li><b>测什么</b>：真实的「找片」题。文字题是用户那种说法(只记得剧情、演员、台词)，看模型给出的候选片名第一个对不对(Top1)、前三个里有没有(Top3)，以及经 TMDB 核对后最后推荐给用户的那部对不对(推荐率)；截图题是剧照/截图认片，只有能看图的模型才测。</li>
                                    <li><b>文字分</b> = 100 × (70% × Top1 命中率 + 15% × Top3 命中率 + 15% × 推荐率) × 速度系数</li>
                                    <li><b>截图分</b> = 100 × (80% × Top1 命中率 + 20% × Top3 命中率) × 速度系数</li>
                                    <li><b>速度系数</b>看中位延迟：1.5 秒以内 ×1，3 秒以内 ×0.95，6 秒以内 ×0.85，更慢 ×0.7。</li>
                                    <li><b>评级</b>取文字分和截图分里高的那个：S ≥ 90，A ≥ 80，B ≥ 65，C ≥ 50，其余 D。鼠标停在评级上能看到两项分数。</li>
                                    <li><b>系列</b>：同一系列(GLM、DeepSeek Flash、Gemma、Qwen…)出新版本一般差别不大，没测过的新模型先按同系列里实测最好的那个估计评级(标「估」)，推荐只看实测分；哪天新版本差别大了，测一下就会以实测为准。</li>
                                    <li><b>推荐</b>：每个用途挑这一项分最高的(同分挑便宜的)；「性价比」是文字分 ≥ 75 里最便宜的；评论审核只要判断能不能发，推荐文字分 ≥ 60 里最便宜的。已下架或过了下架日期的不参与推荐。</li>
                                    <li><b>数据来源</b>：「基准测评」是 2026-11-26 那一轮(12 个模型 × 25 道题)；「快速测评」是在这里点「测评」跑的小题量，题少分数波动大，只作参考。每千次成本按测评里实际用掉的 token 和 Cloudflare 公布的单价算。</li>
                                </ul>
                            </details>

                if (ts == null || ts === '') return 0;

                if (!isFinite(n)) n = Date.parse(ts);
                if (!n || !isFinite(n)) return 0;
                return n < 1e11 ? n * 1000 : n;
            }
            const p2 = n => (n < 10 ? '0' : '') + n;
            function fmtAbs(ts) {
                ts = normTs(ts); if (!ts) return '';
                const d = new Date(ts);
                return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
            }
            function fmtRelAt(ts, now) {
                ts = normTs(ts); if (!ts) return '—';
                const diff = now - ts;
                if (diff < 60000) return '刚刚';
                if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
                if (diff < DAY) return Math.floor(diff / 3600000) + '小时前';
                if (diff < 30 * DAY) return Math.floor(diff / DAY) + '天前';
                const d = new Date(ts);
                return (d.getFullYear() === new Date(now).getFullYear() ? '' : d.getFullYear() + '-') + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
            }
            // 时长：X时Y分(不足 1 分钟显示 <1分，0 显示 0分)
            function fmtDur(sec) {
                sec = Math.max(0, Math.round(Number(sec) || 0));
                if (!sec) return '0分';
                if (sec < 60) return '<1分';
                const m = Math.floor(sec / 60), h = Math.floor(m / 60), mm = m % 60;
                if (!h) return mm + '分';
                return h.toLocaleString('zh-CN') + '时' + (mm ? mm + '分' : '');
            }
            function fmtClock(sec) {
                sec = Math.max(0, Math.round(Number(sec) || 0));
                const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
                return (h ? h + ':' + p2(m) : m) + ':' + p2(s);
            }
            const fmtNum = n => (Number(n) || 0).toLocaleString('zh-CN');
            const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            function dayFull(day) {
                const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(day || '');
                if (!m) return day || '';
                return day + ' ' + WEEK[new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).getUTCDay()];
            }

            // ========== 🤖 AI 模型：纯函数 ==========
            const bjDay = ts => new Date(ts + 8 * 3600000).toISOString().slice(0, 10);   // 北京时间的日期(下架日期按它比)
            // '@cf/zai-org/glm-5.3' → 'glm-5.3'
            const aiShortName = n => String(n || '').split('/').pop();
            // 价格排序键：文字模型 = 入 + 出(每百万 token)；语音 = 每分钟价 × 1000(和文字放一起排时大致可比)；没价格 = null(排最后)
            function aiPriceKey(m) {
                const p = (m && m.price) || {};
                if (p.in != null || p.out != null) return (+p.in || 0) + (+p.out || 0);
                if (p.minute != null) return +p.minute * 1000;
                return null;
            }
            function fmtUsd(n) {
                if (n == null || !isFinite(+n)) return '—';
                n = +n;
                if (n === 0) return '$0';
                return '$' + (n >= 0.1 ? n.toFixed(2) : String(+n.toPrecision(2)));
            }
            // 下架日期距今天(北京时间)还有几天；没有日期 = null
            function daysUntil(day) {
                if (!/^\d{4}-\d{2}-\d{2}$/.test(day || '')) return null;
                return Math.round((Date.parse(day + 'T00:00:00Z') - Date.parse(bjDay(Date.now()) + 'T00:00:00Z')) / DAY);
            }
            function aiIsRunning(d) { const b = d && d.bench; return !!(b && (b.running || (b.queue && b.queue.length))); }
            // 接口返回补齐默认值：后端少给字段时页面也不报错
            function aiNorm(d) {
                if (!d || typeof d !== 'object') throw new ApiError('服务器返回了无法解析的数据', 'parse');
                d.models = Array.isArray(d.models) ? d.models.filter(m => m && m.name) : [];
                d.models.forEach(m => {
                    m.roles = Array.isArray(m.roles) ? m.roles : [];
                    m.efforts = Array.isArray(m.efforts) ? m.efforts : [];
                    m.price = m.price || {};
                });
                ['settings', 'effective', 'recommended', 'defaults', 'usage'].forEach(k => { if (!d[k] || typeof d[k] !== 'object') d[k] = {}; });
                if (!d.bench || typeof d.bench !== 'object') d.bench = {};
                d.bench.queue = Array.isArray(d.bench.queue) ? d.bench.queue : [];
                return d;
            }

            // ========== 📈 柱状图工具 ==========
            // 刻度取 1/2/2.5/5×10^n，整数图(人数)步长至少 1
            function niceScale(max, n, integer) {
                if (!(max > 0)) return integer ? { max: n, step: 1 } : { max: 1, step: 1 };
                const raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
                let step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
                if (integer) step = Math.max(1, Math.round(step));
                return { max: Math.ceil(max / step - 1e-9) * step, step };
            }
            function fmtTick(v, step) {
                const dec = step >= 1 ? 0 : (Math.abs(step * 10 - Math.round(step * 10)) < 1e-9 ? 1 : 2);
                return String(+v.toFixed(dec));
            }
            // 只圆上面两个角(4px)，底部贴基线
            function barPath(x, y, w, h) {
                const r = Math.min(4, w / 2, h);
                return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
                    'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
            }

            // ========== 🌐 统一请求 api() ==========
            class ApiError extends Error {
                constructor(msg, code, status) { super(msg); this.code = code; this.status = status || 0; }
            }
            let adminToken = '';
            let onAuthFail = () => { };
            let MOCK = null;   // ?mock=1 时才会被赋值

            // 15s 超时 + 外部取消(切换筛选时丢弃旧请求)；403 统一回登录页
            async function api(path, opts) {
                opts = opts || {};
                const method = (opts.method || 'GET').toUpperCase();
                // GET 带 nocache=1：站点 Service Worker 会对同源 /api GET 做 Network-First 缓存(缓存键不含 X-Admin-Token)，
                // 带上这个参数 SW 会直接放行——后台数据不进缓存、也不会在弱网时被回放旧副本
                if (method === 'GET') path += (path.indexOf('?') >= 0 ? '&' : '?') + 'nocache=1';
                const ctrl = new AbortController();
                let timedOut = false;
                const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, API_TIMEOUT);
                const ext = opts.signal;
                const onExt = () => ctrl.abort();
                if (ext) { if (ext.aborted) ctrl.abort(); else ext.addEventListener('abort', onExt, { once: true }); }
                try {
                    let status, data;
                    if (MOCK) {
                        const r = await MOCK.handle(path, method, opts.body, ctrl.signal);
                        status = r.status; data = r.data;
                    } else {
                        if (navigator.onLine === false) throw new ApiError('网络已断开，请检查网络后重试', 'offline');
                        const init = { method, headers: { 'X-Admin-Token': adminToken }, cache: 'no-store', credentials: 'same-origin', signal: ctrl.signal };
                        if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
                        const res = await fetch(path, init);
                        status = res.status;
                        const text = await res.text();   // 读 body 也在超时保护内
                        try { data = text ? JSON.parse(text) : null; } catch (e) { data = undefined; }
                    }
                    if (status === 403) {
                        if (!opts.noAuthRedirect) onAuthFail();
                        throw new ApiError('令牌无效或已失效', 'auth', 403);
                    }
                    if (status === 404) throw new ApiError('接口不存在（404）：服务器可能还没升级到新版后台', 'http', 404);
                    if (status < 200 || status >= 300) {
                        const msg = data && (data.error || data.message);
                        throw new ApiError('服务器出错（' + status + '）' + (msg ? '：' + msg : ''), 'http', status);
                    }
                    if (data === undefined || data === null) throw new ApiError('服务器返回了无法解析的数据', 'parse', status);
                    return data;
                } catch (e) {
                    if (e instanceof ApiError) throw e;
                    if (e && e.name === 'AbortError') {
                        if (timedOut) throw new ApiError('请求超时（15 秒无响应），服务器可能正忙', 'timeout');
                        throw new ApiError('已取消', 'abort');
                    }
                    throw new ApiError('网络连接失败，请检查网络后重试', 'network');
                } finally {
                    clearTimeout(timer);
                    if (ext) ext.removeEventListener('abort', onExt);
                }
            }

            // 同一分区的新请求会取消旧请求；结果只写给"最新那一次"，避免乱序覆盖
            const RUNS = {};
            async function runLoad(key, st, fn) {
                const prev = RUNS[key];
                if (prev) prev.ctrl.abort();
                const me = { ctrl: new AbortController() };
                RUNS[key] = me;
                st.loading = true; st.error = '';
                try {
                    const d = await fn(me.ctrl.signal);
                    if (RUNS[key] !== me) return null;
                    st.data = d; st.at = Date.now();
                    return d;
                } catch (e) {
                    if (RUNS[key] !== me) return null;
                    if (e.code !== 'abort' && e.code !== 'auth') st.error = e.message || '加载失败';
                    return null;
                } finally {
                    if (RUNS[key] === me) { st.loading = false; delete RUNS[key]; }
                }
            }
            function abortAll() { Object.keys(RUNS).forEach(k => { try { RUNS[k].ctrl.abort(); } catch (e) { } }); }

            // ========== 🧩 组件：加载态 ==========
            const LoadState = {
                props: { st: { type: Object, required: true }, has: Boolean, label: String },
                emits: ['retry'],
                data() { return { secs: 0 }; },
                watch: {
                    'st.loading': {
                        immediate: true,
                        handler(v) {
                            clearInterval(this.tm); this.secs = 0;
                            if (v) { const t0 = Date.now(); this.tm = setInterval(() => { this.secs = Math.floor((Date.now() - t0) / 1000); }, 1000); }
                        }
                    }
                },
                beforeUnmount() { clearInterval(this.tm); },
                template: '#tpl-load'
            };

            // ========== 🧩 组件：柱状图 ==========
            // 单系列(不做双 y 轴)；两张图通过 active/hover 联动高亮同一天
            const BarChart = {
                props: {
                    items: { type: Array, default: () => [] },     // [{ key, label, full, value, tip:[...] }]
                    height: { type: Number, default: 160 },
                    color: { type: String, default: 'var(--series-1)' },
                    unit: { type: String, default: '' },
                    integer: Boolean,
                    compact: Boolean,
                    active: { type: Number, default: -1 },
                    label: { type: String, default: '' }
                },
                emits: ['hover'],
                data() { return { w: 600, hi: -1 }; },
                computed: {
                    pad() { return this.compact ? { l: 36, r: 4, t: 8, b: 18 } : { l: 44, r: 6, t: 10, b: 22 }; },
                    n() { return this.items.length; },
                    scale() {
                        let max = 0;
                        for (const it of this.items) if (+it.value > max) max = +it.value;
                        return niceScale(max, this.compact ? 2 : 4, this.integer);
                    },
                    innerW() { return Math.max(10, this.w - this.pad.l - this.pad.r); },
                    innerH() { return Math.max(10, this.height - this.pad.t - this.pad.b); },
                    step() { return this.n ? this.innerW / this.n : 0; },
                    bars() {
                        const l = this.pad.l, t = this.pad.t, H = this.innerH, st = this.step, max = this.scale.max;
                        const gap = Math.max(2, st * 0.22), bw = Math.max(1, st - gap);
                        return this.items.map((it, i) => {
                            const v = Math.max(0, +it.value || 0);
                            const h = max > 0 ? Math.min(H, v / max * H) : 0;
                            const x = l + i * st + gap / 2, y = t + H - h;
                            return { y, cx: l + i * st + st / 2, d: h > 0.4 ? barPath(+x.toFixed(2), +y.toFixed(2), +bw.toFixed(2), +h.toFixed(2)) : '' };
                        });
                    },
                    ticks() {
                        const out = [], s = this.scale;
                        for (let k = 0; k * s.step <= s.max + 1e-9; k++) {
                            const v = k * s.step;
                            out.push({ k, y: +(this.pad.t + this.innerH - v / s.max * this.innerH).toFixed(2), label: fmtTick(v, s.step) + this.unit });
                        }
                        return out;
                    },
                    xlabels() {
                        if (!this.n || !this.step) return [];
                        const every = Math.max(1, Math.ceil(42 / this.step)), out = [];
                        for (let i = this.n - 1; i >= 0; i -= every) out.push({ i, x: this.bars[i].cx, label: this.items[i].label });
                        return out;
                    },
                    cur() { const i = this.hi >= 0 ? this.hi : this.active; return i >= 0 && i < this.n ? i : -1; },
                    tip() {
                        if (this.hi < 0 || this.hi >= this.n) return null;
                        const it = this.items[this.hi], b = this.bars[this.hi], half = 74;
                        const x = Math.min(Math.max(b.cx, half), Math.max(half, this.w - half));
                        const lines = 1 + (it.tip ? it.tip.length : 0);
                        return { it, x, y: Math.max(lines * 18 + 10, b.y - 6) };
                    },
                    summary() {
                        if (!this.n) return this.label + '：暂无数据';
                        let mi = 0; this.items.forEach((it, i) => { if (+it.value > +this.items[mi].value) mi = i; });
                        const top = this.items[mi];
                        return this.label + '，共 ' + this.n + ' 天，最高 ' + (top.full || top.label) + '（' + (top.tip && top.tip[0] || top.value) + '）。用左右方向键逐天查看。';
                    },
                    liveText() {
                        if (this.hi < 0 || this.hi >= this.n) return '';
                        const it = this.items[this.hi];
                        return (it.full || it.label) + '：' + (it.tip || [it.value]).join('，');
                    }
                },
                mounted() {
                    const box = this.$refs.box;
                    const measure = () => { const cw = box.clientWidth; if (cw > 0 && Math.abs(cw - this.w) >= 1) this.w = Math.round(cw); };
                    this.measure = measure;
                    measure();
                    this.$nextTick(measure);   // 同一轮更新里 v-show 的显示晚于子组件 mounted → 下一拍再量一次
                    // RO 只在页面真正绘制时回调(后台/被遮挡的标签页不触发)→ 再挂 resize 与数据变化两道兜底
                    if (window.ResizeObserver) { this.ro = new ResizeObserver(measure); this.ro.observe(box); }
                    window.addEventListener('resize', measure);
                },
                beforeUnmount() {
                    if (this.hi >= 0) this.$emit('hover', -1);   // 切走时别把联动高亮留在另一张图上
                    if (this.ro) this.ro.disconnect();
                    window.removeEventListener('resize', this.measure);
                },
                watch: { items() { this.$nextTick(() => this.measure && this.measure()); } },
                methods: {
                    setHi(i) { if (i !== this.hi) { this.hi = i; this.$emit('hover', i); } },
                    onMove(e) {
                        if (!this.n || !this.$refs.svg) return;
                        const r = this.$refs.svg.getBoundingClientRect();
                        const x = e.clientX - r.left - this.pad.l;
                        this.setHi(Math.min(this.n - 1, Math.max(0, Math.floor(x / this.step))));
                    },
                    // 触屏松手也会触发 pointerleave：保留提示，等下一次点按再换；键盘聚焦(focus-visible)时也保留
                    onLeave(e) {
                        if (e.pointerType === 'touch') return;
                        let kb = false;
                        try { kb = this.$refs.box.matches(':focus-visible'); } catch (_) { }
                        if (!kb) this.setHi(-1);
                    },
                    onFocus() { if (this.hi < 0 && this.n) this.setHi(this.n - 1); },
                    onBlur() { this.setHi(-1); },
                    onKey(e) {
                        if (!this.n) return;
                        let i = this.hi < 0 ? this.n - 1 : this.hi;
                        if (e.key === 'ArrowLeft') i = Math.max(0, i - 1);
                        else if (e.key === 'ArrowRight') i = Math.min(this.n - 1, i + 1);
                        else if (e.key === 'Home') i = 0;
                        else if (e.key === 'End') i = this.n - 1;
                        else if (e.key === 'Escape' && this.hi >= 0) { this.setHi(-1); e.stopPropagation(); return; }
                        else return;
                        e.preventDefault(); this.setHi(i);
                    }
                },
                template: '#tpl-chart'
            };

            // ========== 🧩 组件：横向条形 ==========
            const HBars = {
                props: { items: Array, color: { type: String, default: 'var(--series-1)' }, fmt: Function, empty: String },
                computed: { max() { let m = 0; (this.items || []).forEach(it => { if (+it.value > m) m = +it.value; }); return m; } },
                methods: {
                    fmtv(v) { return this.fmt ? this.fmt(v) : fmtNum(v); },
                    w(v) { return this.max > 0 ? Math.max(1, (+v || 0) / this.max * 100).toFixed(1) + '%' : '0%'; }
                },
                template: '#tpl-hbars'
            };

            const Pager = { props: { page: Number, pages: Number }, emits: ['go'], template: '#tpl-pager' };

            // ========== 🛡️ 主应用 ==========
            let qTimerU = null, qTimerR = null, lastFocus = null, cfResolve = null, toastSeq = 0;
            const st0 = () => ({ loading: false, error: '', data: null, at: 0 });
            // AI 分区的界面状态(登出时整个重置)：draft = 「正在使用」里还没保存的编辑；baseJson = 服务器上已保存(或默认)的那份
            const aiState0 = () => ({ filter: 'all', q: '', sort: 'grade', order: 'desc', sel: {}, draft: { text: [], image: [], asr: '', review: '' }, baseJson: '', busy: {}, saving: false, pend: {}, pollFails: 0 });
            // 单选的用途(语音 / 评论审核);评论审核能用的就是文字(聊天)模型,分数也看文字分
            const aiSingle = role => role === 'asr' || role === 'review';
            const aiCap = role => role === 'review' ? 'text' : role;
            // 隐私模式/禁用站点数据时 sessionStorage 可能抛异常 → 一律兜住，只是不记住令牌
            const ssGet = k => { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } };
            const ssSet = (k, v) => { try { if (v) sessionStorage.setItem(k, v); else sessionStorage.removeItem(k); } catch (e) { } };

            const app = createApp({
                template: '#tpl-app',
                components: { LoadState, BarChart, Hbars: HBars, Pager },
                data() {
                    return {
                        K,
                        mock: MOCK_ON,
                        tokenInput: ssGet(TK),
                        authed: false, loginBusy: false, loginErr: '',
                        tab: 'overview',
                        narrow: false,
                        now: Date.now(),
                        ov: Object.assign(st0(), { stale: false }),
                        ovHover: -1,
                        us: Object.assign(st0(), { qInput: '', q: '', type: 'all', status: 'all', sort: 'last_active', order: 'desc', page: 1 }),
                        rq: Object.assign(st0(), { status: 'pending', qInput: '', q: '', sort: 'new', sel: {}, open: null, drafts: {}, busy: {}, badPoster: {}, bulkNote: '', bulkLink: '', bulkBusy: false, bulkExtra: false }),
                        sh: Object.assign(st0(), { channel: '', source: '', page: 1 }),
                        ti: Object.assign(st0(), { busy: {}, showAll: false, trySite: '', tryQ: '', tryRes: null, tryBusy: false }),
                        ai: Object.assign(st0(), aiState0()),
                        uc: Object.assign(st0(), { kind: 'c', filter: 'all', qInput: '', q: '', page: 1, busy: {}, words: '', wordsDefault: [], wordsLoaded: false, wordsBusy: false }),
                        dw: Object.assign(st0(), { open: false, token: '', seed: null, sub: 'shows', exp: {}, banBusy: false }),
                        cf: { open: false, title: '', message: '', ok: '确定', danger: false },
                        toasts: []
                    };
                },
                computed: {
                    curLoading() { const m = { overview: this.ov, users: this.us, requests: this.rq, shares: this.sh, library: this.ti, ucomm: this.uc, ai: this.ai }; return !!(m[this.tab] && m[this.tab].loading); },
                    // ---- AI 模型 ----
                    aiByName() { const o = Object.create(null); ((this.ai.data && this.ai.data.models) || []).forEach(m => { o[m.name] = m; }); return o; },
                    aiRunning() { return aiIsRunning(this.ai.data); },
                    aiQueue() { const b = this.ai.data && this.ai.data.bench; return b ? b.queue.filter(n => n !== b.running) : []; },
                    aiProgPct() { const p = this.ai.data && this.ai.data.bench.progress; return p && p.total ? Math.min(100, Math.round(p.done / p.total * 100)) : 0; },
                    aiUsagePct() { const u = this.ai.data && this.ai.data.usage; return u && u.limit ? Math.min(100, Math.round((+u.count || 0) / u.limit * 100)) : 0; },
                    aiDirty() { return !!this.ai.baseJson && JSON.stringify(this.ai.draft) !== this.ai.baseJson; },
                    aiUsingDefaults() { const s = this.ai.data && this.ai.data.settings; return !!s && !(s.text && s.text.length) && !(s.image && s.image.length) && !s.asr && !s.review; },
                    // 老服务器(没有评论审核)不显示那一栏
                    aiRoles() { const df = (this.ai.data && this.ai.data.defaults) || {}; return K.AI_ROLES.filter(r => r.id !== 'review' || !!df.review); },
                    ucAi() { const r = this.uc.data && this.uc.data.review; return r && typeof r === 'object' ? Object.assign({}, r, { recent: Array.isArray(r.recent) ? r.recent : [] }) : null; },
                    aiCounts() {
                        const c = { usable: 0, text: 0, image: 0, asr: 0, bench: 0, untested: 0 };
                        ((this.ai.data && this.ai.data.models) || []).forEach(m => {
                            if (m.bench) c.bench++;
                            if (m.isNew && !m.bench) c.untested++;
                            if (m.gone) return;
                            c.usable++;
                            ['text', 'image', 'asr'].forEach(r => { if (m.roles.includes(r)) c[r]++; });
                        });
                        return c;
                    },
                    aiFilterCounts() {
                        const o = {}, list = (this.ai.data && this.ai.data.models) || [];
                        K.AI_FILTERS.forEach(f => { o[f.id] = list.filter(m => this.aiMatch(m, f.id)).length; });
                        return o;
                    },
                    // 筛选 + 搜索 + 排序；已下架的永远沉底
                    aiList() {
                        const d = this.ai.data; if (!d) return [];
                        const q = this.ai.q.trim().toLowerCase(), f = this.ai.filter, k = this.ai.sort, dir = this.ai.order === 'asc' ? 1 : -1;
                        const coll = new Intl.Collator('zh-CN', { numeric: true });
                        const val = m => {
                            if (k === 'grade') return m.grade && m.grade.overall ? +m.grade.overall.score : null;
                            if (k === 'price') return aiPriceKey(m);
                            if (k === 'ctx') return m.ctx ? +m.ctx : null;
                            if (k === 'bench') return m.bench && m.bench.textN ? m.bench.textTop1 / m.bench.textN : null;
                            return null;
                        };
                        const byPrice = (a, b) => { const pa = aiPriceKey(a), pb = aiPriceKey(b); return pa == null || pb == null ? (pa == null) - (pb == null) : pa - pb; };
                        return d.models.filter(m => this.aiMatch(m, f) && (!q || (m.name + ' ' + (m.desc || '')).toLowerCase().indexOf(q) >= 0)).sort((a, b) => {
                            if (!!a.gone !== !!b.gone) return a.gone ? 1 : -1;
                            if (k === 'name') return coll.compare(aiShortName(a.name), aiShortName(b.name)) * dir;
                            const va = val(a), vb = val(b);
                            if (va == null || vb == null) { if (va != null || vb != null) return va == null ? 1 : -1; }
                            else if (va !== vb) return (va - vb) * dir;
                            return byPrice(a, b) || coll.compare(aiShortName(a.name), aiShortName(b.name));
                        });
                    },
                    aiSelNames() { return Object.keys(this.ai.sel).filter(n => this.ai.sel[n] && this.aiByName[n] && this.aiCanBench(this.aiByName[n])).slice(0, 6); },
                    ucWordCount() { return this.uc.words.split(/\r?\n/).map(w => w.trim()).filter(Boolean).length; },
                    // ---- 片库 ----
                    tiRows() {
                        const d = this.ti.data; if (!d || !Array.isArray(d.sites)) return [];
                        // 默认只列走索引的 / 有收录的 / 手动指定过的;搜索正常和打不开(未确认)的勾选后再看

                        for (const x of s) {
                            if (x.active) st.active++;
                            if (x.mode === 'nosearch') { st.nosearch++; st.total += x.total || 0; }

                    },
                    pendingCount() {

                    },
                    // ---- 概览 ----
                    kpis() {

                        const total = u.total || 0;
                        const pct = n => total ? Math.round((n || 0) / total * 100) + '%' : '—';
                        const types = ['independent', 'primary', 'airport', 'unknown'].filter(k => bt[k]).map(k => TYPE_LABEL[k] + ' ' + fmtNum(bt[k]));
                        return [
                            { k: 'users', label: '总用户', value: fmtNum(total), sub: types.join(' · ') || '—', go: { tab: 'users', status: 'all', type: 'all' } },
                            { k: 'a1', label: '今日活跃', value: fmtNum(u.active_1d), sub: '占 ' + pct(u.active_1d) + ' · 近 24 小时', go: { tab: 'users', status: 'active1' } },
                            { k: 'a7', label: '7 日活跃', value: fmtNum(u.active_7d), sub: '占 ' + pct(u.active_7d), go: { tab: 'users', status: 'active7' } },
                            { k: 'a30', label: '30 日活跃', value: fmtNum(u.active_30d), sub: '沉睡 ' + fmtNum(Math.max(0, total - (u.active_30d || 0))) + ' 人', go: { tab: 'users', status: 'active30' } },
                            { k: 'new', label: '近 7 日新增', value: fmtNum(u.new_7d), sub: '已封禁 ' + fmtNum(u.banned), go: { tab: 'users', status: 'all', sort: 'first_seen' } },
                            { k: 'today', label: '今日观看', value: fmtDur(w.today_seconds), sub: '近 7 日 ' + fmtDur(w.d7_seconds) },
                            { k: 'd30', label: '近 30 天观看', value: fmtDur(w.d30_seconds), sub: '日均 ' + fmtDur((w.d30_seconds || 0) / 30) },
                            { k: 'total', label: '累计实测时长', value: fmtDur(w.total_seconds), sub: '其中直播 ' + fmtDur(w.live_seconds) },

                            { k: 'share', label: '分享次数', value: fmtNum(s.total), sub: '近 30 天 ' + fmtNum(s.d30), go: { tab: 'shares' } },
                            { k: 'opens', label: '分享带来打开', value: fmtNum(s.opens), sub: '去重 ' + fmtNum(s.uniq_visitors) + ' · 带来登录 ' + fmtNum(s.logins), go: { tab: 'users', status: 'shares', sort: 'share_opens' } },

                    },
                    daily() { return (this.ov.data && Array.isArray(this.ov.data.daily)) ? this.ov.data.daily : []; },
                    dailySum() {
                        let seconds = 0, peakUsers = 0;
                        this.daily.forEach(d => { seconds += +d.seconds || 0; if (+d.users > peakUsers) peakUsers = +d.users; });
                        return { seconds, peakUsers };
                    },
                    hoursItems() {
                        return this.daily.map(d => ({ key: d.day, label: String(d.day || '').slice(5), full: dayFull(d.day), value: (+d.seconds || 0) / 3600, tip: ['观看 ' + fmtDur(d.seconds), '在看 ' + fmtNum(d.users) + ' 人'] }));
                    },
                    usersItems() {

                    },
                    topShows() {

                    },
                    liveItems() { return ((this.ov.data && this.ov.data.top_live) || []).map(s => ({ label: s.title, value: +s.seconds || 0, extra: fmtNum(s.users) + ' 人在看' })); },
                    sourceItems() { return this.objItems(this.ov.data && this.ov.data.shares && this.ov.data.shares.by_source, k => k); },
                    channelItems() { return this.objItems(this.ov.data && this.ov.data.shares && this.ov.data.shares.by_channel, k => CH_LABEL[k] || k); },
                    // ---- 用户 ----
                    typeOptions() {
                        const bt = (this.ov.data && this.ov.data.users && this.ov.data.users.by_type) || {};
                        const out = [['all', '全部类型'], ['independent', '独立密码'], ['primary', '主密码']];
                        if (bt.airport > 0 || this.us.type === 'airport') out.push(['airport', '机场用户']);   // 没有机场用户(main 分支)就不显示

                    },
                    // STATS_DISABLE=1：有 sqlite(stats_available 为真)但服务器不再采集，旧数字会一直停着
                    ovStatsOff() { const d = this.ov.data; return !!(d && d.stats_available && d.tracking_enabled === false); },
                    userFiltered() { const u = this.us; return !!(u.q || u.qInput || u.type !== 'all' || u.status !== 'all' || u.sort !== 'last_active' || u.order !== 'desc'); },
                    userPages() { const d = this.us.data; return d ? Math.max(1, Math.ceil((d.total || 0) / (d.size || PAGE_SIZE))) : 1; },
                    // ---- 求片 ----
                    reqCounts() {
                        if (this.rq.data && this.rq.data.counts) return this.rq.data.counts;
                        const r = this.ov.data && this.ov.data.requests;
                        return r ? { all: r.total, pending: r.pending, need_info: r.need_info, fulfilled: r.fulfilled, rejected: r.rejected } : {};
                    },
                    // 单条处理后留在列表里的变暗卡(moved)不能被全选/批量带上：否则「全选 → 批量无法提供」会把刚标已提供的那条改掉
                    selectableReqs() { return (this.rq.data ? this.rq.data.requests : []).filter(r => !this.isMoved(r)); },
                    selIds() {
                        const moved = new Set((this.rq.data ? this.rq.data.requests : []).filter(r => this.isMoved(r)).map(r => String(r.id)));
                        const ids = []; for (const k in this.rq.sel) if (this.rq.sel[k] && !moved.has(String(k))) ids.push(k); return ids;
                    },
                    selCount() { return this.selIds.length; },
                    allSelected() { const l = this.selectableReqs; return l.length > 0 && l.every(r => this.rq.sel[r.id]); },
                    someSelected() { return this.selCount > 0 && !this.allSelected; },
                    // ---- 分享 ----
                    sharePages() { const d = this.sh.data; return d ? Math.max(1, Math.ceil((d.total || 0) / (d.size || PAGE_SIZE))) : 1; },
                    sourceOptions() {
                        const set = new Set(SOURCE_PRESET);
                        const bs = this.ov.data && this.ov.data.shares && this.ov.data.shares.by_source;
                        if (bs) Object.keys(bs).forEach(k => set.add(k));
                        if (this.sh.source) set.add(this.sh.source);
                        return Array.from(set);
                    },
                    // ---- 抽屉 ----
                    dwUser() { return (this.dw.data && this.dw.data.user) || this.dw.seed || null; },
                    dwMetrics() {
                        const u = this.dw.data && this.dw.data.user; if (!u) return [];
                        return [
                            ['观看时长', fmtDur(u.watch_seconds), u.live_seconds ? '直播 ' + fmtDur(u.live_seconds) : '实测'],
                            ['观看集数', fmtNum(u.episodes), '看完 ' + fmtNum(u.episodes_done)],
                            ['看过剧数', fmtNum(u.shows), u.legacy_shows ? '旧同步 ' + u.legacy_shows + ' 部' : ''],
                            ['30 天活跃', fmtNum(u.active_days_30) + ' 天', '有观看的天数'],
                            ['设备', u.last_device || '—', ''],
                            ['最近活跃', this.fmtRel(u.last_active), fmtAbs(u.last_active), fmtAbs(u.last_active)],
                            ['最近登录', this.fmtRel(u.last_login), fmtAbs(u.last_login), fmtAbs(u.last_login)],
                            ['首次出现', this.fmtRel(u.first_seen), fmtAbs(u.first_seen), fmtAbs(u.first_seen)],
                            ['分享', fmtNum(u.shares) + ' 次', '打开 ' + fmtNum(u.share_opens) + ' · 登录 ' + fmtNum(u.share_logins)],
                            ['求片', fmtNum(u.requests), '']
                        ];
                    },
                    dwDaily() {
                        const list = (this.dw.data && this.dw.data.daily) || [];
                        let max = 0, sum = 0, days = 0;
                        list.forEach(d => { const s = +d.seconds || 0; sum += s; if (s > 0) days++; if (s > max) max = s; });
                        const unit = max >= 7200 ? 'h' : 'm', div = unit === 'h' ? 3600 : 60;
                        return { unit, sum, days, items: list.map(d => ({ key: d.day, label: String(d.day || '').slice(5), full: dayFull(d.day), value: (+d.seconds || 0) / div, tip: ['观看 ' + fmtDur(d.seconds)] })) };
                    },
                    dwMaxShow() { return ((this.dw.data && this.dw.data.shows) || []).reduce((m, s) => Math.max(m, +s.seconds || 0), 0); },
                    dwTabs() {
                        const d = this.dw.data || {};
                        return [
                            { id: 'shows', label: '看过的剧', n: (d.shows || []).length },
                            { id: 'history', label: '同步历史', n: (d.history || []).length },
                            { id: 'shares', label: '分享', n: (d.shares || []).length },
                            { id: 'requests', label: '求片', n: (d.requests || []).length }
                        ];
                    }
                },
                watch: {
                    'us.qInput'(v) {
                        clearTimeout(qTimerU);
                        qTimerU = setTimeout(() => { if (this.us.q !== v.trim()) { this.us.q = v.trim(); this.us.page = 1; this.loadUsers(); } }, 300);
                    },
                    'rq.qInput'(v) {
                        clearTimeout(qTimerR);
                        qTimerR = setTimeout(() => { if (this.rq.q !== v.trim()) { this.rq.q = v.trim(); this.loadRequests(); } }, 300);
                    },
                    'rq.sort'() { this.loadRequests(); },
                    'dw.open'(v) { document.body.classList.toggle('lock', !!v || this.cf.open); },
                    'cf.open'(v) { document.body.classList.toggle('lock', !!v || this.dw.open); }
                },
                created() {
                    // 用户筛选：任一变化 → 回第 1 页重新拉
                    this.$watch(() => [this.us.type, this.us.status, this.us.sort, this.us.order].join('|'), () => {
                        this.us.page = 1;
                        if (this.authed) this.loadUsers();
                    });
                    this.$watch(() => this.sh.channel + '|' + this.sh.source, () => {
                        this.sh.page = 1;
                        if (this.authed) this.loadShares();
                    });
                    onAuthFail = () => this.kickOut('令牌无效或已失效，请重新登录');
                },
                mounted() {
                    const mq = window.matchMedia('(max-width: 820px)');
                    this.narrow = mq.matches;
                    const onMq = e => { this.narrow = e.matches; };
                    if (mq.addEventListener) mq.addEventListener('change', onMq); else mq.addListener(onMq);
                    window.addEventListener('hashchange', () => { if (this.authed) this.applyTab(this.tabFromHash()); });
                    document.addEventListener('keydown', this.onGlobalKey);
                    setInterval(() => { this.now = Date.now(); }, 30000);   // 相对时间(N分钟前)定时刷新
                    if (this.tokenInput) this.login();                    // sessionStorage 有令牌 → 自动登录
                    else this.$nextTick(() => this.$refs.tokenInput && this.$refs.tokenInput.focus());
                },
                methods: {
                    // ---------- 格式化(模板用) ----------
                    fmtRel(ts) { return fmtRelAt(ts, this.now); },
                    fmtAbs, fmtDur, fmtNum, fmtClock,
                    typeLabel(t) { return TYPE_LABEL[t] || t || '未知'; },
                    statusLabel(s) { return STATUS_LABEL[s] || s; },
                    // 当前分类下刚被单条处理成别的状态、还没刷新掉的卡
                    isMoved(r) { return this.rq.status !== 'all' && r.status !== this.rq.status; },
                    statusIcon(s) { return STATUS_ICON[s] || ''; },
                    chLabel(c) { return CH_LABEL[c] || c || '其它'; },
                    shortTok(t, n) { t = String(t || ''); n = n || 12; return t.length > n ? t.slice(0, n) + '…' : (t || '—'); },
                    pctOf(v, max) { return max > 0 ? Math.max(1, (+v || 0) / max * 100).toFixed(1) : 0; },
                    hasKeys(o) { return !!o && typeof o === 'object' && Object.keys(o).some(k => +o[k] > 0); },
                    topChips(o, n) {
                        if (!o || typeof o !== 'object') return [];
                        const arr = Object.keys(o).map(k => [k, +o[k] || 0]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
                        if (!n || arr.length <= n) return arr;
                        const rest = arr.slice(n - 1).reduce((s, x) => s + x[1], 0);
                        return arr.slice(0, n - 1).concat([['其它', rest]]);
                    },
                    objItems(o, labelOf) {
                        if (!o || typeof o !== 'object') return [];
                        return Object.keys(o).map(k => ({ label: labelOf(k), value: +o[k] || 0 })).filter(x => x.value > 0).sort((a, b) => b.value - a.value);
                    },
                    histPct(h) {
                        let p = Number(h.progress);
                        if (!isFinite(p) || p <= 0) p = h.progressDuration ? (h.progressTime || 0) / h.progressDuration * 100 : 0;
                        return Math.min(100, Math.max(0, Math.round(p)));
                    },
                    waitDays(r) {
                        if (r.wait_days != null && isFinite(+r.wait_days)) return Math.max(0, Math.floor(+r.wait_days));
                        const c = normTs(r.created_at); return c ? Math.max(0, Math.floor((this.now - c) / DAY)) : 0;
                    },
                    // 海报：poster 是用户提交的任意串，直接 <img src> 外站地址会把站长 IP/UA/查看时间泄露给对方。
                    // 只认 TMDB(路径 /xxx.jpg 或 image.tmdb.org 完整 URL)，取文件名后一律走本站 /api/tmdb-image 代理；其它不显示。
                    // 尺寸用 w342：代理白名单里没有 w154(会 400)，首页海报也是 w342，能命中服务器磁盘缓存。
                    posterUrl(p) {
                        p = String(p || '').trim();
                        if (!p) return '';
                        if (MOCK_ON && /^data:image\//i.test(p)) return p;   // 仅 mock：内联 SVG 不发网络请求；真实服务器从不存 data: 海报
                        // 文件名规则与代理的校验一致(字母数字.jpg/png/webp)，不合格的送过去也只会 400
                        const m = /^\/([A-Za-z0-9]+\.(?:jpe?g|png|webp))$/i.exec(p)
                            || /^https?:\/\/image\.tmdb\.org\/t\/p\/[a-z0-9]+\/([A-Za-z0-9]+\.(?:jpe?g|png|webp))(?:[?#].*)?$/i.exec(p);
                        return m ? '/api/tmdb-image/w342/' + m[1] : '';
                    },
                    // 只放行常见可点协议，挡掉 javascript:/data: 等(站长误粘或数据被污染时的兜底)
                    safeHref(u) {
                        const s = String(u || '').trim();
                        if (/^(https?:|magnet:|ed2k:|thunder:)/i.test(s)) return s;
                        if (/^\/(?!\/)/.test(s)) return s;
                        return '';
                    },
                    tmdbPage(r) {
                        const m = /^(movie|tv)[\/:_-]?(\d+)$/i.exec(String(r.tmdb_id || '').trim());
                        return m ? 'https://www.themoviedb.org/' + m[1].toLowerCase() + '/' + m[2] : '';
                    },
                    // tmdb_id 只有纯数字时分不清电影/剧集 → 退回按片名搜索
                    tmdbHref(r) { return this.tmdbPage(r) || 'https://www.themoviedb.org/search?query=' + encodeURIComponent(r.name || ''); },
                    doubanHref(r) { return 'https://search.douban.com/movie/subject_search?search_text=' + encodeURIComponent(r.name || ''); },

                    // ---------- 登录 / 退出 ----------
                    async login() {
                        const t = (this.tokenInput || '').trim();
                        if (!t) { this.loginErr = '请输入令牌'; return; }
                        if (this.loginBusy) return;
                        adminToken = t;
                        this.loginBusy = true; this.loginErr = '';
                        try {
                            const d = await api('/api/admin/overview', { noAuthRedirect: true });
                            this.ov.data = d; this.ov.at = Date.now(); this.ov.error = ''; this.ov.stale = false;
                            ssSet(TK, t);
                            this.authed = true;
                            this.applyTab(this.tabFromHash());
                        } catch (e) {
                            adminToken = '';
                            this.loginErr = e.code === 'auth' ? '令牌无效' : (e.message || '登录失败');
                            if (e.code === 'auth') ssSet(TK, '');
                            this.$nextTick(() => this.$refs.tokenInput && this.$refs.tokenInput.focus());
                        } finally {
                            this.loginBusy = false;
                        }
                    },
                    resetAll() {
                        abortAll();
                        this.ov = Object.assign(st0(), { stale: false });
                        Object.assign(this.us, st0(), { page: 1 });
                        Object.assign(this.rq, st0(), { sel: {}, open: null, drafts: {}, busy: {} });
                        Object.assign(this.sh, st0(), { page: 1 });
                        clearTimeout(this._tiTimer);
                        Object.assign(this.ti, st0(), { busy: {}, tryRes: null, tryBusy: false });
                        clearTimeout(this._aiPoll);
                        Object.assign(this.ai, st0(), aiState0());
                        this.dw.open = false; this.dw.data = null;
                        if (this.cf.open) this.cfDone(false);
                    },
                    logout() {
                        ssSet(TK, '');
                        adminToken = ''; this.tokenInput = ''; this.loginErr = '';
                        this.authed = false; this.resetAll();
                    },
                    kickOut(msg) {
                        if (!this.authed) return;
                        ssSet(TK, '');
                        adminToken = ''; this.tokenInput = '';
                        this.authed = false; this.resetAll();
                        this.loginErr = msg;
                        this.$nextTick(() => this.$refs.tokenInput && this.$refs.tokenInput.focus());
                    },

                    // ---------- 分区 / 路由(#overview 等) ----------
                    tabFromHash() { const h = location.hash.replace(/^#/, ''); return K.TABS.some(t => t.id === h) ? h : 'overview'; },
                    setTab(id) {
                        if (location.hash !== '#' + id) location.hash = id;   // → hashchange → applyTab
                        else this.applyTab(id);
                    },
                    applyTab(id) { this.tab = id; this.ensureTab(id); },
                    ensureTab(id) {
                        if (id === 'overview' && (!this.ov.data || this.ov.stale) && !this.ov.loading) this.loadOverview();
                        else if (id === 'users' && !this.us.data && !this.us.loading) this.loadUsers();
                        else if (id === 'requests' && !this.rq.data && !this.rq.loading) this.loadRequests();
                        else if (id === 'shares' && !this.sh.data && !this.sh.loading) this.loadShares();
                        else if (id === 'library' && !this.ti.loading) this.loadTitleIndex();
                        else if (id === 'ai' && !this.ai.loading) this.loadAi();
                        else if (id === 'ucomm' && !this.uc.data && !this.uc.loading) { this.loadUcomm(); this.loadUcWords(); }
                    },
                    refresh() {
                        if (this.tab === 'overview') this.loadOverview();
                        else { this.ov.stale = true; ({ users: this.loadUsers, requests: this.loadRequests, shares: this.loadShares, library: this.loadTitleIndex, ucomm: this.loadUcomm, ai: this.loadAi })[this.tab].call(this); }
                    },
                    goKpi(go) {
                        if (go.tab === 'users') {
                            // KPI 的含义是「全体里的某一类」：类型/状态/搜索/页码全部重置。
                            // 只清搜索词时 [type,status,sort,order] watcher 不触发、us.data 也在，旧搜索结果会留在列表里(搜索框却是空的)
                            const u = this.us, key = () => [u.type, u.status, u.sort, u.order].join('|');
                            const before = key();

                    // ---------- 🤖 AI 模型 ----------
                    loadAi() {
                        clearTimeout(this._aiPoll);
                        return runLoad('ai', this.ai, signal => api('/api/admin/ai', { signal }).then(aiNorm)).then(d => { if (d) this.aiApply(d); });
                    },
                    // 所有接口(GET / refresh / settings / bench)都回同一个形状 → 统一从这里落地。
                    // force：刚保存过，用服务器那份覆盖草稿；否则只有草稿没改过时才跟着服务器走(轮询不会冲掉正在编辑的顺序)
                    aiApply(d, force) {
                        const a = this.ai;
                        a.data = d; a.at = Date.now(); a.error = '';
                        const bj = JSON.stringify(this.aiBaseOf(d));
                        if (force || !a.baseJson || JSON.stringify(a.draft) === a.baseJson) a.draft = JSON.parse(bj);
                        a.baseJson = bj;
                        // 上次还在跑/排队、这次不在了的 = 测完了，逐个报结果。bench.last 只记最后一个，
                        // 两次轮询之间测完两个时，前一个靠 bench.at 变新来判断成功
                        const b = d.bench, last = b.last || {}, by = this.aiByName;
                        const pendNow = [b.running].concat(b.queue).filter(Boolean);
                        Object.keys(a.pend).forEach(n => {
                            if (pendNow.includes(n)) return;
                            const m = by[n], at = m && m.bench ? m.bench.at : 0, g = m && m.grade && m.grade.overall;
                            if (last.name === n && last.ok === false) this.toast('测评失败：' + aiShortName(n) + (last.error ? '(' + last.error + ')' : ''), 'err');
                            else if ((at && at !== a.pend[n]) || (last.name === n && last.ok)) this.toast('测评完成：' + aiShortName(n) + (g ? ' → ' + g.letter + ' 级(' + this.aiScore(g.score) + ' 分)' : ''), 'ok');
                            else this.toast('测评结束：' + aiShortName(n) + ' 没有出新结果', 'err');
                        });
                        const pend = {};
                        pendNow.forEach(n => { pend[n] = by[n] && by[n].bench ? by[n].bench.at : 0; });
                        a.pend = pend;
                        if (pendNow.length) this.aiSchedulePoll(); else clearTimeout(this._aiPoll);
                    },
                    // 测评期间每 2 秒拉一次；不在 AI 分区就停(回来时 ensureTab 会重新加载并接着轮询)
                    aiSchedulePoll() {
                        clearTimeout(this._aiPoll);
                        if (!this.authed || this.tab !== 'ai') return;
                        this._aiPoll = setTimeout(async () => {
                            if (!this.authed || this.tab !== 'ai' || RUNS.ai) return;   // 正在整页加载：它落地时会自己接着排
                            try {
                                const d = aiNorm(await api('/api/admin/ai'));
                                this.ai.pollFails = 0;
                                if (this.authed && !RUNS.ai) this.aiApply(d);
                            } catch (e) {
                                if (e.code === 'auth') return;
                                if (++this.ai.pollFails < 5) this.aiSchedulePoll();
                                else this.toast('测评进度刷新失败：' + e.message + '(点右上角刷新再看)', 'err');
                            }
                        }, 2000);
                    },
                    // 服务器上保存的选择；没保存过的用途用默认
                    aiBaseOf(d) {
                        const s = (d && d.settings) || {}, df = (d && d.defaults) || {};
                        const arr = (a, b) => (Array.isArray(a) && a.length ? a : (Array.isArray(b) ? b : [])).slice();
                        return { text: arr(s.text, df.text), image: arr(s.image, df.image), asr: s.asr || df.asr || '', review: s.review || df.review || '' };
                    },
                    aiShort(n) { return aiShortName(n); },
                    aiScore(s) { return s == null || !isFinite(+s) ? '—' : String(Math.round(+s * 10) / 10); },

                    aiDay(ts) { return fmtAbs(ts).slice(0, 10) || '—'; },
                    aiCtx(n) { n = +n; if (!(n > 0)) return '—'; return n >= 1e6 ? +(n / 1e6).toFixed(1) + 'M' : Math.round(n / 1024) + 'K'; },

                    aiMatch(m, f) {

                        const out = [];

                    aiReqText(m) {

                    aiReqTitle(m) { const r = m.request || {}; return 'extra: ' + JSON.stringify(r.extra || {}) + '\nmax_tokens: ' + (r.maxTokens || '默认'); },
                    aiBadges(m) {
                        const d = this.ai.data, rec = (d && d.recommended) || {}, out = [];

                    // 在「实际在跑」的顺序里排第几(文字 主 / 截图 备1 …)
                    aiInUse(n) {

                        ['text', 'image'].forEach(r => { const i = Array.isArray(e[r]) ? e[r].indexOf(n) : -1; if (i >= 0) L.push(this.aiRoleLabel(r) + (i === 0 ? '主' : '备' + i)); });
