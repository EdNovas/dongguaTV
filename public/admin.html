    <script>
        (function () {
            'use strict';
            if (typeof Vue === 'undefined') {
                document.getElementById('app').innerHTML = '<div class="boot">Vue 加载失败（libs/js/vue.global.prod.min.js），请刷新重试</div>';
                return;
            }
            const { createApp } = Vue;

            // ========== ⚙️ 常量 ==========
            const TK = 'donggua_admin_token';
            const API_TIMEOUT = 15000;           // 任何请求 15 秒必定结束(成功/失败)，加载态绝不永远转圈
            const PAGE_SIZE = 30;
            const DAY = 86400000;
            const QS = new URLSearchParams(location.search);
            const MOCK_ON = QS.get('mock') === '1';   // 只有 ?mock=1 才启用本地假数据；否则 mock 代码完全不执行

            const TYPE_LABEL = { independent: '独立密码', primary: '主密码', airport: '机场用户', unknown: '未知' };
            const STATUS_LABEL = { pending: '待处理', need_info: '需补充', fulfilled: '已提供', rejected: '无法提供' };
            const STATUS_ICON = { pending: '⏳', need_info: '❓', fulfilled: '✓', rejected: '✕' };
            const CHANNELS = [['wechat', '微信'], ['qq', 'QQ'], ['copy', '复制链接'], ['telegram', 'Telegram'], ['whatsapp', 'WhatsApp'], ['facebook', 'Facebook'], ['x', 'X'], ['instagram', 'Instagram'], ['native', '系统分享'], ['other', '其它']];
            const CH_LABEL = Object.fromEntries(CHANNELS);
            const SOURCE_PRESET = ['微信', '企业微信', 'QQ', 'QQ浏览器', '微博', '钉钉', '飞书', '抖音/TikTok', '小红书', '百度App', 'Telegram', 'Facebook', 'Instagram', 'LINE', 'X', 'Google', '百度', 'Bing', '直接打开'];
            const K = Object.freeze({
                TABS: [{ id: 'overview', label: '概览', icon: '📊' }, { id: 'users', label: '用户', icon: '👥' }, { id: 'requests', label: '求片', icon: '📮' }, { id: 'shares', label: '分享', icon: '🔗' }],
                USER_STATUS: [['all', '全部状态'], ['active1', '今日活跃'], ['active7', '7 日活跃'], ['active30', '30 日活跃'], ['dormant', '沉睡 30 天+'], ['never', '从未观看'], ['banned', '已封禁'], ['requests', '有求片'], ['shares', '有分享']],
                USER_SORTS: [['last_active', '最近活跃'], ['last_login', '最近登录'], ['watch', '观看时长'], ['episodes', '观看集数'], ['shows', '看过剧数'], ['last_watch', '最近观看'], ['first_seen', '首次出现'], ['share_opens', '分享带来打开'], ['shares', '分享次数'], ['requests', '求片数']],
                USER_COLS: [
                    { sort: 'watch', label: '观看时长', num: true }, { sort: 'episodes', label: '集数', num: true }, { sort: 'shows', label: '剧数', num: true },
                    { sort: 'last_watch', label: '最近在看' }, { sort: 'last_active', label: '活跃 / 登录' },
                    { sort: 'share_opens', label: '分享带来', num: true }, { sort: 'requests', label: '求片', num: true }
                ],
                REQ_TABS: [{ id: 'pending', label: '待处理' }, { id: 'need_info', label: '需补充' }, { id: 'fulfilled', label: '已提供' }, { id: 'rejected', label: '无法提供' }, { id: 'all', label: '全部' }],
                REPLY_TEMPLATES: [
                    { text: '已上架，站内搜索片名即可观看', st: 'fulfilled' },
                    { text: '已提供链接，见上方', st: 'fulfilled' },
                    { text: '暂无资源，有了会第一时间补上', st: 'rejected' },
                    { text: '还没上映 / 还没有片源，上线后补上', st: 'rejected' },
                    { text: '请补充年份/外文名，方便找片', st: 'need_info' }
                ],
                CHANNELS
            });

            // ========== 🧮 纯函数：格式化 ==========
            // 时间戳统一成毫秒(兼容秒级/ISO 字符串)，0 = 没有
            function normTs(ts) {
                if (ts == null || ts === '') return 0;
                let n = typeof ts === 'number' ? ts : Number(ts);
                if (!isFinite(n)) n = Date.parse(ts);
                if (!n || !isFinite(n)) return 0;
                return n < 1e11 ? n * 1000 : n;
            }
            const p2 = n => (n < 10 ? '0' : '') + n;
            function fmtAbs(ts) {
                ts = normTs(ts); if (!ts) return '';
                const d = new Date(ts);
                return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
            }
            function fmtRelAt(ts, now) {
                ts = normTs(ts); if (!ts) return '—';
                const diff = now - ts;
                if (diff < 60000) return '刚刚';
                if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
                if (diff < DAY) return Math.floor(diff / 3600000) + '小时前';
                if (diff < 30 * DAY) return Math.floor(diff / DAY) + '天前';
                const d = new Date(ts);
                return (d.getFullYear() === new Date(now).getFullYear() ? '' : d.getFullYear() + '-') + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
            }
            // 时长：X时Y分(不足 1 分钟显示 <1分，0 显示 0分)
            function fmtDur(sec) {
                sec = Math.max(0, Math.round(Number(sec) || 0));
                if (!sec) return '0分';
                if (sec < 60) return '<1分';
                const m = Math.floor(sec / 60), h = Math.floor(m / 60), mm = m % 60;
                if (!h) return mm + '分';
                return h.toLocaleString('zh-CN') + '时' + (mm ? mm + '分' : '');
            }
            function fmtClock(sec) {
                sec = Math.max(0, Math.round(Number(sec) || 0));
                const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
                return (h ? h + ':' + p2(m) : m) + ':' + p2(s);
            }
            const fmtNum = n => (Number(n) || 0).toLocaleString('zh-CN');
            const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            function dayFull(day) {
                const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(day || '');
                if (!m) return day || '';
                return day + ' ' + WEEK[new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).getUTCDay()];
            }

            // ========== 📈 柱状图工具 ==========
            // 刻度取 1/2/2.5/5×10^n，整数图(人数)步长至少 1
            function niceScale(max, n, integer) {
                if (!(max > 0)) return integer ? { max: n, step: 1 } : { max: 1, step: 1 };
                const raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
                let step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p;
                if (integer) step = Math.max(1, Math.round(step));
                return { max: Math.ceil(max / step - 1e-9) * step, step };
            }
            function fmtTick(v, step) {
                const dec = step >= 1 ? 0 : (Math.abs(step * 10 - Math.round(step * 10)) < 1e-9 ? 1 : 2);
                return String(+v.toFixed(dec));
            }
            // 只圆上面两个角(4px)，底部贴基线
            function barPath(x, y, w, h) {
                const r = Math.min(4, w / 2, h);
                return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y +
                    'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
            }

            // ========== 🌐 统一请求 api() ==========
            class ApiError extends Error {
                constructor(msg, code, status) { super(msg); this.code = code; this.status = status || 0; }
            }
            let adminToken = '';
            let onAuthFail = () => { };
            let MOCK = null;   // ?mock=1 时才会被赋值

            // 15s 超时 + 外部取消(切换筛选时丢弃旧请求)；403 统一回登录页
            async function api(path, opts) {
                opts = opts || {};
                const method = (opts.method || 'GET').toUpperCase();
                // GET 带 nocache=1：站点 Service Worker 会对同源 /api GET 做 Network-First 缓存(缓存键不含 X-Admin-Token)，
                // 带上这个参数 SW 会直接放行——后台数据不进缓存、也不会在弱网时被回放旧副本
                if (method === 'GET') path += (path.indexOf('?') >= 0 ? '&' : '?') + 'nocache=1';
                const ctrl = new AbortController();
                let timedOut = false;
                const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, API_TIMEOUT);
                const ext = opts.signal;
                const onExt = () => ctrl.abort();
                if (ext) { if (ext.aborted) ctrl.abort(); else ext.addEventListener('abort', onExt, { once: true }); }
                try {
                    let status, data;
                    if (MOCK) {
                        const r = await MOCK.handle(path, method, opts.body, ctrl.signal);
                        status = r.status; data = r.data;
                    } else {
                        if (navigator.onLine === false) throw new ApiError('网络已断开，请检查网络后重试', 'offline');
                        const init = { method, headers: { 'X-Admin-Token': adminToken }, cache: 'no-store', credentials: 'same-origin', signal: ctrl.signal };
                        if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
                        const res = await fetch(path, init);
                        status = res.status;
                        const text = await res.text();   // 读 body 也在超时保护内
                        try { data = text ? JSON.parse(text) : null; } catch (e) { data = undefined; }
                    }
                    if (status === 403) {
                        if (!opts.noAuthRedirect) onAuthFail();
                        throw new ApiError('令牌无效或已失效', 'auth', 403);
                    }
                    if (status === 404) throw new ApiError('接口不存在（404）：服务器可能还没升级到新版后台', 'http', 404);
                    if (status < 200 || status >= 300) {
                        const msg = data && (data.error || data.message);
                        throw new ApiError('服务器出错（' + status + '）' + (msg ? '：' + msg : ''), 'http', status);
                    }
                    if (data === undefined || data === null) throw new ApiError('服务器返回了无法解析的数据', 'parse', status);
                    return data;
                } catch (e) {
                    if (e instanceof ApiError) throw e;
                    if (e && e.name === 'AbortError') {
                        if (timedOut) throw new ApiError('请求超时（15 秒无响应），服务器可能正忙', 'timeout');
                        throw new ApiError('已取消', 'abort');
                    }
                    throw new ApiError('网络连接失败，请检查网络后重试', 'network');
                } finally {
                    clearTimeout(timer);
                    if (ext) ext.removeEventListener('abort', onExt);
                }
            }

            // 同一分区的新请求会取消旧请求；结果只写给"最新那一次"，避免乱序覆盖
            const RUNS = {};
            async function runLoad(key, st, fn) {
                const prev = RUNS[key];
                if (prev) prev.ctrl.abort();
                const me = { ctrl: new AbortController() };
                RUNS[key] = me;
                st.loading = true; st.error = '';
                try {
                    const d = await fn(me.ctrl.signal);
                    if (RUNS[key] !== me) return null;
                    st.data = d; st.at = Date.now();
                    return d;
                } catch (e) {
                    if (RUNS[key] !== me) return null;
                    if (e.code !== 'abort' && e.code !== 'auth') st.error = e.message || '加载失败';
                    return null;
                } finally {
                    if (RUNS[key] === me) { st.loading = false; delete RUNS[key]; }
                }
            }
            function abortAll() { Object.keys(RUNS).forEach(k => { try { RUNS[k].ctrl.abort(); } catch (e) { } }); }

            // ========== 🧩 组件：加载态 ==========
            const LoadState = {
                props: { st: { type: Object, required: true }, has: Boolean, label: String },
                emits: ['retry'],
                data() { return { secs: 0 }; },
                watch: {
                    'st.loading': {
                        immediate: true,
                        handler(v) {
                            clearInterval(this.tm); this.secs = 0;
                            if (v) { const t0 = Date.now(); this.tm = setInterval(() => { this.secs = Math.floor((Date.now() - t0) / 1000); }, 1000); }
                        }
                    }
                },
                beforeUnmount() { clearInterval(this.tm); },
                template: '#tpl-load'
            };

            // ========== 🧩 组件：柱状图 ==========
            // 单系列(不做双 y 轴)；两张图通过 active/hover 联动高亮同一天
            const BarChart = {
                props: {
                    items: { type: Array, default: () => [] },     // [{ key, label, full, value, tip:[...] }]
                    height: { type: Number, default: 160 },
                    color: { type: String, default: 'var(--series-1)' },
                    unit: { type: String, default: '' },
                    integer: Boolean,
                    compact: Boolean,
                    active: { type: Number, default: -1 },
                    label: { type: String, default: '' }
                },
                emits: ['hover'],
                data() { return { w: 600, hi: -1 }; },
                computed: {
                    pad() { return this.compact ? { l: 36, r: 4, t: 8, b: 18 } : { l: 44, r: 6, t: 10, b: 22 }; },
                    n() { return this.items.length; },
                    scale() {
                        let max = 0;
                        for (const it of this.items) if (+it.value > max) max = +it.value;
                        return niceScale(max, this.compact ? 2 : 4, this.integer);
                    },
                    innerW() { return Math.max(10, this.w - this.pad.l - this.pad.r); },
                    innerH() { return Math.max(10, this.height - this.pad.t - this.pad.b); },
                    step() { return this.n ? this.innerW / this.n : 0; },
                    bars() {
                        const l = this.pad.l, t = this.pad.t, H = this.innerH, st = this.step, max = this.scale.max;
                        const gap = Math.max(2, st * 0.22), bw = Math.max(1, st - gap);
                        return this.items.map((it, i) => {
                            const v = Math.max(0, +it.value || 0);
                            const h = max > 0 ? Math.min(H, v / max * H) : 0;
                            const x = l + i * st + gap / 2, y = t + H - h;
                            return { y, cx: l + i * st + st / 2, d: h > 0.4 ? barPath(+x.toFixed(2), +y.toFixed(2), +bw.toFixed(2), +h.toFixed(2)) : '' };
                        });
                    },
                    ticks() {
                        const out = [], s = this.scale;
                        for (let k = 0; k * s.step <= s.max + 1e-9; k++) {
                            const v = k * s.step;
                            out.push({ k, y: +(this.pad.t + this.innerH - v / s.max * this.innerH).toFixed(2), label: fmtTick(v, s.step) + this.unit });
                        }
                        return out;
                    },
                    xlabels() {
                        if (!this.n || !this.step) return [];
                        const every = Math.max(1, Math.ceil(42 / this.step)), out = [];
                        for (let i = this.n - 1; i >= 0; i -= every) out.push({ i, x: this.bars[i].cx, label: this.items[i].label });
                        return out;
                    },
                    cur() { const i = this.hi >= 0 ? this.hi : this.active; return i >= 0 && i < this.n ? i : -1; },
                    tip() {
                        if (this.hi < 0 || this.hi >= this.n) return null;
                        const it = this.items[this.hi], b = this.bars[this.hi], half = 74;
                        const x = Math.min(Math.max(b.cx, half), Math.max(half, this.w - half));
                        const lines = 1 + (it.tip ? it.tip.length : 0);
                        return { it, x, y: Math.max(lines * 18 + 10, b.y - 6) };
                    },
                    summary() {
                        if (!this.n) return this.label + '：暂无数据';
                        let mi = 0; this.items.forEach((it, i) => { if (+it.value > +this.items[mi].value) mi = i; });
                        const top = this.items[mi];
                        return this.label + '，共 ' + this.n + ' 天，最高 ' + (top.full || top.label) + '（' + (top.tip && top.tip[0] || top.value) + '）。用左右方向键逐天查看。';
                    },
                    liveText() {
                        if (this.hi < 0 || this.hi >= this.n) return '';
                        const it = this.items[this.hi];
                        return (it.full || it.label) + '：' + (it.tip || [it.value]).join('，');
                    }
                },
                mounted() {
                    const box = this.$refs.box;
                    const measure = () => { const cw = box.clientWidth; if (cw > 0 && Math.abs(cw - this.w) >= 1) this.w = Math.round(cw); };
                    this.measure = measure;
                    measure();
                    this.$nextTick(measure);   // 同一轮更新里 v-show 的显示晚于子组件 mounted → 下一拍再量一次
                    // RO 只在页面真正绘制时回调(后台/被遮挡的标签页不触发)→ 再挂 resize 与数据变化两道兜底
                    if (window.ResizeObserver) { this.ro = new ResizeObserver(measure); this.ro.observe(box); }
                    window.addEventListener('resize', measure);
                },
                beforeUnmount() {
                    if (this.hi >= 0) this.$emit('hover', -1);   // 切走时别把联动高亮留在另一张图上
                    if (this.ro) this.ro.disconnect();
                    window.removeEventListener('resize', this.measure);
                },
                watch: { items() { this.$nextTick(() => this.measure && this.measure()); } },
                methods: {
                    setHi(i) { if (i !== this.hi) { this.hi = i; this.$emit('hover', i); } },
                    onMove(e) {
                        if (!this.n || !this.$refs.svg) return;
                        const r = this.$refs.svg.getBoundingClientRect();
                        const x = e.clientX - r.left - this.pad.l;
                        this.setHi(Math.min(this.n - 1, Math.max(0, Math.floor(x / this.step))));
                    },
                    // 触屏松手也会触发 pointerleave：保留提示，等下一次点按再换；键盘聚焦(focus-visible)时也保留
                    onLeave(e) {
                        if (e.pointerType === 'touch') return;
                        let kb = false;
                        try { kb = this.$refs.box.matches(':focus-visible'); } catch (_) { }
                        if (!kb) this.setHi(-1);
                    },
                    onFocus() { if (this.hi < 0 && this.n) this.setHi(this.n - 1); },
                    onBlur() { this.setHi(-1); },
                    onKey(e) {
                        if (!this.n) return;
                        let i = this.hi < 0 ? this.n - 1 : this.hi;
                        if (e.key === 'ArrowLeft') i = Math.max(0, i - 1);
                        else if (e.key === 'ArrowRight') i = Math.min(this.n - 1, i + 1);
                        else if (e.key === 'Home') i = 0;
                        else if (e.key === 'End') i = this.n - 1;
                        else if (e.key === 'Escape' && this.hi >= 0) { this.setHi(-1); e.stopPropagation(); return; }
                        else return;
                        e.preventDefault(); this.setHi(i);
                    }
                },
                template: '#tpl-chart'
            };

            // ========== 🧩 组件：横向条形 ==========
            const HBars = {
                props: { items: Array, color: { type: String, default: 'var(--series-1)' }, fmt: Function, empty: String },
                computed: { max() { let m = 0; (this.items || []).forEach(it => { if (+it.value > m) m = +it.value; }); return m; } },
                methods: {
                    fmtv(v) { return this.fmt ? this.fmt(v) : fmtNum(v); },
                    w(v) { return this.max > 0 ? Math.max(1, (+v || 0) / this.max * 100).toFixed(1) + '%' : '0%'; }
                },
                template: '#tpl-hbars'
            };

            const Pager = { props: { page: Number, pages: Number }, emits: ['go'], template: '#tpl-pager' };

            // ========== 🛡️ 主应用 ==========
            let qTimerU = null, qTimerR = null, lastFocus = null, cfResolve = null, toastSeq = 0;
            const st0 = () => ({ loading: false, error: '', data: null, at: 0 });
            // 隐私模式/禁用站点数据时 sessionStorage 可能抛异常 → 一律兜住，只是不记住令牌
            const ssGet = k => { try { return sessionStorage.getItem(k) || ''; } catch (e) { return ''; } };
            const ssSet = (k, v) => { try { if (v) sessionStorage.setItem(k, v); else sessionStorage.removeItem(k); } catch (e) { } };

            const app = createApp({
                template: '#tpl-app',
                components: { LoadState, BarChart, Hbars: HBars, Pager },
                data() {
                    return {
                        K,
                        mock: MOCK_ON,
                        tokenInput: ssGet(TK),
                        authed: false, loginBusy: false, loginErr: '',
                        tab: 'overview',
                        narrow: false,
                        now: Date.now(),
                        ov: Object.assign(st0(), { stale: false }),
                        ovHover: -1,
                        us: Object.assign(st0(), { qInput: '', q: '', type: 'all', status: 'all', sort: 'last_active', order: 'desc', page: 1 }),
                        rq: Object.assign(st0(), { status: 'pending', qInput: '', q: '', sort: 'new', sel: {}, open: null, drafts: {}, busy: {}, badPoster: {}, bulkNote: '', bulkLink: '', bulkBusy: false, bulkExtra: false }),
                        sh: Object.assign(st0(), { channel: '', source: '', page: 1 }),
                        dw: Object.assign(st0(), { open: false, token: '', seed: null, sub: 'shows', exp: {}, banBusy: false }),
                        cf: { open: false, title: '', message: '', ok: '确定', danger: false },
                        toasts: []
                    };
                },
                computed: {
                    curLoading() { const m = { overview: this.ov, users: this.us, requests: this.rq, shares: this.sh }; return !!(m[this.tab] && m[this.tab].loading); },
                    pendingCount() {
                        const c = this.reqCounts;
                        return (c.pending || 0);
                    },
                    // ---- 概览 ----
                    kpis() {
                        const d = this.ov.data; if (!d) return [];
                        const u = d.users || {}, w = d.watch || {}, s = d.shares || {}, r = d.requests || {}, bt = u.by_type || {};
                        const total = u.total || 0;
                        const pct = n => total ? Math.round((n || 0) / total * 100) + '%' : '—';
                        const types = ['independent', 'primary', 'airport', 'unknown'].filter(k => bt[k]).map(k => TYPE_LABEL[k] + ' ' + fmtNum(bt[k]));
                        return [
                            { k: 'users', label: '总用户', value: fmtNum(total), sub: types.join(' · ') || '—', go: { tab: 'users', status: 'all', type: 'all' } },
                            { k: 'a1', label: '今日活跃', value: fmtNum(u.active_1d), sub: '占 ' + pct(u.active_1d) + ' · 近 24 小时', go: { tab: 'users', status: 'active1' } },
                            { k: 'a7', label: '7 日活跃', value: fmtNum(u.active_7d), sub: '占 ' + pct(u.active_7d), go: { tab: 'users', status: 'active7' } },
                            { k: 'a30', label: '30 日活跃', value: fmtNum(u.active_30d), sub: '沉睡 ' + fmtNum(Math.max(0, total - (u.active_30d || 0))) + ' 人', go: { tab: 'users', status: 'active30' } },
                            { k: 'new', label: '近 7 日新增', value: fmtNum(u.new_7d), sub: '已封禁 ' + fmtNum(u.banned), go: { tab: 'users', status: 'all', sort: 'first_seen' } },
                            { k: 'today', label: '今日观看', value: fmtDur(w.today_seconds), sub: '近 7 日 ' + fmtDur(w.d7_seconds) },
                            { k: 'd30', label: '近 30 天观看', value: fmtDur(w.d30_seconds), sub: '日均 ' + fmtDur((w.d30_seconds || 0) / 30) },
                            { k: 'total', label: '累计实测时长', value: fmtDur(w.total_seconds), sub: '其中直播 ' + fmtDur(w.live_seconds) },
                            { k: 'eps', label: '看过集数', value: fmtNum(w.episodes), sub: fmtNum(w.shows) + ' 部剧（满 2 分钟或看完才算）' },
                            { k: 'share', label: '分享次数', value: fmtNum(s.total), sub: '近 30 天 ' + fmtNum(s.d30), go: { tab: 'shares' } },
                            { k: 'opens', label: '分享带来打开', value: fmtNum(s.opens), sub: '去重 ' + fmtNum(s.uniq_visitors) + ' · 带来登录 ' + fmtNum(s.logins), go: { tab: 'users', status: 'shares', sort: 'share_opens' } },
                            { k: 'req', label: '待处理求片', value: fmtNum(r.pending), sub: '需补充 ' + fmtNum(r.need_info) + ' · 共 ' + fmtNum(r.total), tone: r.pending > 0 ? 'warn' : '', go: { tab: 'requests', reqStatus: 'pending' } }
                        ];
                    },
                    daily() { return (this.ov.data && Array.isArray(this.ov.data.daily)) ? this.ov.data.daily : []; },
                    dailySum() {
                        let seconds = 0, peakUsers = 0;
                        this.daily.forEach(d => { seconds += +d.seconds || 0; if (+d.users > peakUsers) peakUsers = +d.users; });
                        return { seconds, peakUsers };
                    },
                    hoursItems() {
                        return this.daily.map(d => ({ key: d.day, label: String(d.day || '').slice(5), full: dayFull(d.day), value: (+d.seconds || 0) / 3600, tip: ['观看 ' + fmtDur(d.seconds), '在看 ' + fmtNum(d.users) + ' 人'] }));
                    },
                    usersItems() {
                        return this.daily.map(d => ({ key: d.day, label: String(d.day || '').slice(5), full: dayFull(d.day), value: +d.users || 0, tip: ['在看 ' + fmtNum(d.users) + ' 人', '观看 ' + fmtDur(d.seconds)] }));
                    },
                    topShows() {
                        const list = (this.ov.data && this.ov.data.top_shows) || [];
                        const max = list.reduce((m, s) => Math.max(m, +s.seconds || 0), 0);
                        return list.map(s => Object.assign({}, s, { pct: max ? Math.max(1, s.seconds / max * 100) : 0 }));
                    },
                    liveItems() { return ((this.ov.data && this.ov.data.top_live) || []).map(s => ({ label: s.title, value: +s.seconds || 0, extra: fmtNum(s.users) + ' 人在看' })); },
                    sourceItems() { return this.objItems(this.ov.data && this.ov.data.shares && this.ov.data.shares.by_source, k => k); },
                    channelItems() { return this.objItems(this.ov.data && this.ov.data.shares && this.ov.data.shares.by_channel, k => CH_LABEL[k] || k); },
                    // ---- 用户 ----
                    typeOptions() {
                        const bt = (this.ov.data && this.ov.data.users && this.ov.data.users.by_type) || {};
                        const out = [['all', '全部类型'], ['independent', '独立密码'], ['primary', '主密码']];
                        if (bt.airport > 0 || this.us.type === 'airport') out.push(['airport', '机场用户']);   // 没有机场用户(main 分支)就不显示
                        out.push(['unknown', '未知']);
                        return out;
                    },
                    // STATS_DISABLE=1：有 sqlite(stats_available 为真)但服务器不再采集，旧数字会一直停着
                    ovStatsOff() { const d = this.ov.data; return !!(d && d.stats_available && d.tracking_enabled === false); },
                    userFiltered() { const u = this.us; return !!(u.q || u.qInput || u.type !== 'all' || u.status !== 'all' || u.sort !== 'last_active' || u.order !== 'desc'); },
                    userPages() { const d = this.us.data; return d ? Math.max(1, Math.ceil((d.total || 0) / (d.size || PAGE_SIZE))) : 1; },
                    // ---- 求片 ----
                    reqCounts() {
                        if (this.rq.data && this.rq.data.counts) return this.rq.data.counts;
                        const r = this.ov.data && this.ov.data.requests;
                        return r ? { all: r.total, pending: r.pending, need_info: r.need_info, fulfilled: r.fulfilled, rejected: r.rejected } : {};
                    },
                    // 单条处理后留在列表里的变暗卡(moved)不能被全选/批量带上：否则「全选 → 批量无法提供」会把刚标已提供的那条改掉
                    selectableReqs() { return (this.rq.data ? this.rq.data.requests : []).filter(r => !this.isMoved(r)); },
                    selIds() {
                        const moved = new Set((this.rq.data ? this.rq.data.requests : []).filter(r => this.isMoved(r)).map(r => String(r.id)));
                        const ids = []; for (const k in this.rq.sel) if (this.rq.sel[k] && !moved.has(String(k))) ids.push(k); return ids;
                    },
                    selCount() { return this.selIds.length; },
                    allSelected() { const l = this.selectableReqs; return l.length > 0 && l.every(r => this.rq.sel[r.id]); },
                    someSelected() { return this.selCount > 0 && !this.allSelected; },
                    // ---- 分享 ----
                    sharePages() { const d = this.sh.data; return d ? Math.max(1, Math.ceil((d.total || 0) / (d.size || PAGE_SIZE))) : 1; },
                    sourceOptions() {
                        const set = new Set(SOURCE_PRESET);
                        const bs = this.ov.data && this.ov.data.shares && this.ov.data.shares.by_source;
                        if (bs) Object.keys(bs).forEach(k => set.add(k));
                        if (this.sh.source) set.add(this.sh.source);
                        return Array.from(set);
                    },
                    // ---- 抽屉 ----
                    dwUser() { return (this.dw.data && this.dw.data.user) || this.dw.seed || null; },
                    dwMetrics() {
                        const u = this.dw.data && this.dw.data.user; if (!u) return [];
                        return [
                            ['观看时长', fmtDur(u.watch_seconds), u.live_seconds ? '直播 ' + fmtDur(u.live_seconds) : '实测'],
                            ['观看集数', fmtNum(u.episodes), '看完 ' + fmtNum(u.episodes_done)],
                            ['看过剧数', fmtNum(u.shows), u.legacy_shows ? '旧同步 ' + u.legacy_shows + ' 部' : ''],
                            ['30 天活跃', fmtNum(u.active_days_30) + ' 天', '有观看的天数'],
                            ['设备', u.last_device || '—', ''],
                            ['最近活跃', this.fmtRel(u.last_active), fmtAbs(u.last_active), fmtAbs(u.last_active)],
                            ['最近登录', this.fmtRel(u.last_login), fmtAbs(u.last_login), fmtAbs(u.last_login)],
                            ['首次出现', this.fmtRel(u.first_seen), fmtAbs(u.first_seen), fmtAbs(u.first_seen)],
                            ['分享', fmtNum(u.shares) + ' 次', '打开 ' + fmtNum(u.share_opens) + ' · 登录 ' + fmtNum(u.share_logins)],
                            ['求片', fmtNum(u.requests), '']
                        ];
                    },
                    dwDaily() {
                        const list = (this.dw.data && this.dw.data.daily) || [];
                        let max = 0, sum = 0, days = 0;
                        list.forEach(d => { const s = +d.seconds || 0; sum += s; if (s > 0) days++; if (s > max) max = s; });
                        const unit = max >= 7200 ? 'h' : 'm', div = unit === 'h' ? 3600 : 60;
                        return { unit, sum, days, items: list.map(d => ({ key: d.day, label: String(d.day || '').slice(5), full: dayFull(d.day), value: (+d.seconds || 0) / div, tip: ['观看 ' + fmtDur(d.seconds)] })) };
                    },
                    dwMaxShow() { return ((this.dw.data && this.dw.data.shows) || []).reduce((m, s) => Math.max(m, +s.seconds || 0), 0); },
                    dwTabs() {
                        const d = this.dw.data || {};
                        return [
                            { id: 'shows', label: '看过的剧', n: (d.shows || []).length },
                            { id: 'history', label: '同步历史', n: (d.history || []).length },
                            { id: 'shares', label: '分享', n: (d.shares || []).length },
                            { id: 'requests', label: '求片', n: (d.requests || []).length }
                        ];
                    }
                },
                watch: {
                    'us.qInput'(v) {
                        clearTimeout(qTimerU);
                        qTimerU = setTimeout(() => { if (this.us.q !== v.trim()) { this.us.q = v.trim(); this.us.page = 1; this.loadUsers(); } }, 300);
                    },
                    'rq.qInput'(v) {
                        clearTimeout(qTimerR);
                        qTimerR = setTimeout(() => { if (this.rq.q !== v.trim()) { this.rq.q = v.trim(); this.loadRequests(); } }, 300);
                    },
                    'rq.sort'() { this.loadRequests(); },
                    'dw.open'(v) { document.body.classList.toggle('lock', !!v || this.cf.open); },
                    'cf.open'(v) { document.body.classList.toggle('lock', !!v || this.dw.open); }
                },
                created() {
                    // 用户筛选：任一变化 → 回第 1 页重新拉
                    this.$watch(() => [this.us.type, this.us.status, this.us.sort, this.us.order].join('|'), () => {
                        this.us.page = 1;
                        if (this.authed) this.loadUsers();
                    });
                    this.$watch(() => this.sh.channel + '|' + this.sh.source, () => {
                        this.sh.page = 1;
                        if (this.authed) this.loadShares();
                    });
                    onAuthFail = () => this.kickOut('令牌无效或已失效，请重新登录');
                },
                mounted() {
                    const mq = window.matchMedia('(max-width: 820px)');
                    this.narrow = mq.matches;
                    const onMq = e => { this.narrow = e.matches; };
                    if (mq.addEventListener) mq.addEventListener('change', onMq); else mq.addListener(onMq);
                    window.addEventListener('hashchange', () => { if (this.authed) this.applyTab(this.tabFromHash()); });
                    document.addEventListener('keydown', this.onGlobalKey);
                    setInterval(() => { this.now = Date.now(); }, 30000);   // 相对时间(N分钟前)定时刷新
                    if (this.tokenInput) this.login();                    // sessionStorage 有令牌 → 自动登录
                    else this.$nextTick(() => this.$refs.tokenInput && this.$refs.tokenInput.focus());
                },
                methods: {
                    // ---------- 格式化(模板用) ----------
                    fmtRel(ts) { return fmtRelAt(ts, this.now); },
                    fmtAbs, fmtDur, fmtNum, fmtClock,
                    typeLabel(t) { return TYPE_LABEL[t] || t || '未知'; },
                    statusLabel(s) { return STATUS_LABEL[s] || s; },
                    // 当前分类下刚被单条处理成别的状态、还没刷新掉的卡
                    isMoved(r) { return this.rq.status !== 'all' && r.status !== this.rq.status; },
                    statusIcon(s) { return STATUS_ICON[s] || ''; },
                    chLabel(c) { return CH_LABEL[c] || c || '其它'; },
                    shortTok(t, n) { t = String(t || ''); n = n || 12; return t.length > n ? t.slice(0, n) + '…' : (t || '—'); },
                    pctOf(v, max) { return max > 0 ? Math.max(1, (+v || 0) / max * 100).toFixed(1) : 0; },
                    hasKeys(o) { return !!o && typeof o === 'object' && Object.keys(o).some(k => +o[k] > 0); },
                    topChips(o, n) {
                        if (!o || typeof o !== 'object') return [];
                        const arr = Object.keys(o).map(k => [k, +o[k] || 0]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
                        if (!n || arr.length <= n) return arr;
                        const rest = arr.slice(n - 1).reduce((s, x) => s + x[1], 0);
                        return arr.slice(0, n - 1).concat([['其它', rest]]);
                    },
                    objItems(o, labelOf) {
                        if (!o || typeof o !== 'object') return [];
                        return Object.keys(o).map(k => ({ label: labelOf(k), value: +o[k] || 0 })).filter(x => x.value > 0).sort((a, b) => b.value - a.value);
                    },
                    histPct(h) {
                        let p = Number(h.progress);
                        if (!isFinite(p) || p <= 0) p = h.progressDuration ? (h.progressTime || 0) / h.progressDuration * 100 : 0;
                        return Math.min(100, Math.max(0, Math.round(p)));
                    },
                    waitDays(r) {
                        if (r.wait_days != null && isFinite(+r.wait_days)) return Math.max(0, Math.floor(+r.wait_days));
                        const c = normTs(r.created_at); return c ? Math.max(0, Math.floor((this.now - c) / DAY)) : 0;
                    },
                    // 海报：poster 是用户提交的任意串，直接 <img src> 外站地址会把站长 IP/UA/查看时间泄露给对方。
                    // 只认 TMDB(路径 /xxx.jpg 或 image.tmdb.org 完整 URL)，取文件名后一律走本站 /api/tmdb-image 代理；其它不显示。
                    // 尺寸用 w342：代理白名单里没有 w154(会 400)，首页海报也是 w342，能命中服务器磁盘缓存。
                    posterUrl(p) {
                        p = String(p || '').trim();
                        if (!p) return '';
                        if (MOCK_ON && /^data:image\//i.test(p)) return p;   // 仅 mock：内联 SVG 不发网络请求；真实服务器从不存 data: 海报
                        // 文件名规则与代理的校验一致(字母数字.jpg/png/webp)，不合格的送过去也只会 400
                        const m = /^\/([A-Za-z0-9]+\.(?:jpe?g|png|webp))$/i.exec(p)
                            || /^https?:\/\/image\.tmdb\.org\/t\/p\/[a-z0-9]+\/([A-Za-z0-9]+\.(?:jpe?g|png|webp))(?:[?#].*)?$/i.exec(p);
                        return m ? '/api/tmdb-image/w342/' + m[1] : '';
                    },
                    // 只放行常见可点协议，挡掉 javascript:/data: 等(站长误粘或数据被污染时的兜底)
                    safeHref(u) {
                        const s = String(u || '').trim();

                    },
                    tmdbPage(r) {
                        const m = /^(movie|tv)[\/:_-]?(\d+)$/i.exec(String(r.tmdb_id || '').trim());

                    },

                    tmdbHref(r) { return this.tmdbPage(r) || 'https://www.themoviedb.org/search?query=' + encodeURIComponent(r.name || ''); },

                    // ---------- 登录 / 退出 ----------

                    // ---------- 求片处理 ----------
                    toggleReq(r) {

                    useTpl(r, t) { const d = this.rq.drafts[r.id]; if (!d) return; d.note = t.text; d.suggest = t.st; },
                    bumpCount(from, to) {

                    async reqAct(r, action) {

                            const ok = await this.ask({ title: '删除求片', message: '删除「' + r.name + '」这条求片？删除后用户在「我的求片」里也看不到了。', ok: '删除', danger: true });
                            if (!ok) return;
                        }
                        const d = this.rq.drafts[r.id] || { link: r.fulfill_link || '', note: r.fulfill_note || '' };
                        // 旧接口 POST /api/requests/admin：令牌在 body.admin(兼容)，同时也带 X-Admin-Token 头
                        const body = action === 'delete'
                            ? { admin: adminToken, id: r.id, action: 'delete' }
                            : { admin: adminToken, id: r.id, status: action, fulfill_link: (d.link || '').trim(), fulfill_note: (d.note || '').trim() };

                            const res = await api('/api/requests/admin', { method: 'POST', body });
                            if (!res || !res.ok) throw new ApiError((res && res.error) || '操作失败', 'fail');

                    },
                    toggleAll(on) {

                    },
                    clearSel() { this.rq.sel = {}; },
                    async bulk(action) {
                        const list = this.rq.data ? this.rq.data.requests : [];
                        const byKey = {}; list.forEach(r => { byKey[String(r.id)] = r; });
                        const ids = this.selIds.map(k => (byKey[k] ? byKey[k].id : k));

                            for (let i = 0; i < ids.length; i += 200) {   // 接口每次最多 200 条
                                const body = { ids: ids.slice(i, i + 200), action };
                                if (expect) body.expect = expect;
                                if (action !== 'delete') {
                                    if (this.rq.bulkLink.trim()) body.fulfill_link = this.rq.bulkLink.trim();
                                    if (this.rq.bulkNote.trim()) body.fulfill_note = this.rq.bulkNote.trim();
                                }

                                if (!res || !res.ok) throw new ApiError((res && res.error) || '操作失败', 'fail');
                                changed += +res.changed || 0;
                            }

                            this.toast('已' + label + ' ' + changed + ' 条' + (skipped > 0 ? '（' + skipped + ' 条状态已变化或已删除，未改动）' : ''), 'ok');
                            this.rq.sel = {}; this.rq.bulkNote = ''; this.rq.bulkLink = '';

                        } catch (e) {

                        } finally { this.rq.bulkBusy = false; }
                    },

                    // ---------- 通用：确认框 / toast / 复制 / 键盘 ----------
                    ask(o) {

                        Object.assign(this.cf, { open: true, title: o.title || '确认', message: o.message || '', ok: o.ok || '确定', danger: !!o.danger });

                        if (r) r(v);
                        const f = this.cfPrevFocus; this.cfPrevFocus = null;
                        if (f && document.contains(f) && f.focus) this.$nextTick(() => { try { f.focus(); } catch (e) { } });
                    },
                    toast(msg, kind) {

                    },
                    async copy(text, what) {

                    onGlobalKey(e) {

                    },
                    // 弹层内 Tab 循环(抽屉 / 确认框)
                    trapTab(e) {
                        if (e.key !== 'Tab') return;
                        const root = e.currentTarget;
                        const els = Array.from(root.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'))
                            .filter(el => el.offsetParent !== null || el === document.activeElement);
                        if (!els.length) return;

                        if (e.shiftKey && (document.activeElement === first || !root.contains(document.activeElement))) { e.preventDefault(); last.focus(); }

                    }
                }
            });

            // =====================================================================
            // 🧪 MOCK 模式(?mock=1)：本地生成几百个用户/观看/分享/求片，供开发时脱离服务器调 UI。
            //    可选参数：&mockslow=1 每个请求拖 20 秒(验证 15s 超时)；&mockfail=0.3 按概率返回 500；
            //    &mockfailon=users 只让该接口失败；&mock403=users 该接口返回 403(演练踢回登录页)；
            //    &nostats=1 模拟非 sqlite(stats_available:false)；&statsoff=1 模拟 STATS_DISABLE=1(tracking_enabled:false，保留关闭前的数据)，
            //    &statsoff=2 同上但从一开始就关(tracking_since:null)。令牌输入 bad → 403。
            //    未带 ?mock=1 时 createMock 根本不会被调用。
            // =====================================================================
            function createMock() {
                const NOW = Date.now(), MIN = 60000, HOUR = 3600000;
                const SLOW = QS.get('mockslow') === '1';
                const FAIL = Math.min(1, Math.max(0, parseFloat(QS.get('mockfail')) || 0));
                const NOSTATS = QS.get('nostats') === '1';
                const STATSOFF = QS.get('statsoff') || '';   // '1' | '2'，见上
                const FAIL_ON = QS.get('mockfailon') || '';   // 只让路径含该串的接口按 mockfail 概率失败(不给 mockfail 时 = 必失败)
                const F403_ON = QS.get('mock403') || '';      // 路径含该串的接口返回 403(演练会话中途令牌失效)
                let seed = 20261007;
                const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };

                        by_channel[s.channel] = (by_channel[s.channel] || 0) + 1;
                        Object.keys(s.sources).forEach(k => { by_source[k] = (by_source[k] || 0) + s.sources[k]; });
                        opens += s.opens; uniq += s.uniq; logins += s.logins; previews += s.previews;
                    });
                    return {
                        stats_available: true, tracking_enabled: !STATSOFF, tracking_since: STATSOFF === '2' ? null : dayKey(TRACK),
                        users: {
                            total: rows.length, by_type: countTypes(), active_1d: rows.filter(r => within(r.last_active, 1)).length, active_7d: rows.filter(r => within(r.last_active, 7)).length,
                            active_30d: rows.filter(r => within(r.last_active, 30)).length, new_7d: rows.filter(r => within(r.first_seen, 7)).length, banned: rows.filter(r => r.banned).length
                        },
                        watch: {
                            today_seconds: today_s, d7_seconds: d7, d30_seconds: d30, total_seconds: rows.reduce((s, r) => s + r.watch_seconds, 0), live_seconds: rows.reduce((s, r) => s + r.live_seconds, 0),
                            episodes: rows.reduce((s, r) => s + r.episodes, 0), shows: allTitles.size
                        },
                        daily: Object.values(dmap),
                        top_shows: Object.values(showAgg).map(a => ({ title: a.title, seconds: a.seconds, users: a.users.size, episodes: a.episodes })).sort((a, b) => b.seconds - a.seconds).slice(0, 15),
                        top_live: Object.values(liveAgg).map(a => ({ title: a.title, seconds: a.seconds, users: a.users.size })).sort((a, b) => b.seconds - a.seconds).slice(0, 8),
                        shares: { total: shares.length, d30: shares.filter(s => within(s.created_at, 30)).length, opens, uniq_visitors: uniq, logins, previews, by_channel, by_source },
                        requests: reqCounts(requests)
                    };
                }
                function countTypes() { const o = { independent: 0, primary: 0, airport: 0, unknown: 0 }; users.forEach(u => { o[u.row.type]++; }); return o; }
                function days(n) { const out = []; for (let i = n - 1; i >= 0; i--) out.push(dayKey(NOW - i * DAY)); return out; }
                function reqCounts(list) {
                    const c = { total: list.length, all: list.length, pending: 0, need_info: 0, fulfilled: 0, rejected: 0 };
                    list.forEach(r => { c[r.status]++; });
                    return c;
                }
                function rowOut(u) { const r = clone(u.row); if (NOSTATS) Object.assign(r, { watch_seconds: 0, live_seconds: 0, episodes: 0, episodes_done: 0, shows: 0, active_days_30: 0, last_watch_at: null, last_title: null, last_episode: null }); return r; }

                const SORTK = { last_active: 'last_active', last_login: 'last_login', watch: 'watch_seconds', episodes: 'episodes', shows: 'shows', last_watch: 'last_watch_at', first_seen: 'first_seen', shares: 'shares', share_opens: 'share_opens', requests: 'requests' };
                function usersList(p) {
                    const q = (p.get('q') || '').toLowerCase(), type = p.get('type') || 'all', status = p.get('status') || 'all';
                    const within = (ts, d) => ts && NOW - ts < d * DAY;
                    let list = users.filter(u => {
                        const r = u.row;
                        if (type !== 'all' && r.type !== type) return false;
                        if (q && r.identity.toLowerCase().indexOf(q) < 0 && r.token.toLowerCase().indexOf(q) < 0) return false;
                        switch (status) {
                            case 'active1': return within(r.last_active, 1);
                            case 'active7': return within(r.last_active, 7);
                            case 'active30': return within(r.last_active, 30);
                            case 'dormant': return !within(r.last_active, 30);
                            case 'never': return !u.vod.length && !u.live.length && !u.history.length;
                            case 'banned': return r.banned;
                            case 'requests': return r.requests > 0;
                            case 'shares': return r.shares > 0;
                            default: return true;
                        }
                    });
                    const k = SORTK[p.get('sort')] || 'last_active', dir = p.get('order') === 'asc' ? 1 : -1;
                    list.sort((a, b) => {
                        const va = a.row[k], vb = b.row[k], na = va == null, nb = vb == null;
                        if (na || nb) return na === nb ? 0 : (na ? 1 : -1);   // 空值永远排最后
                        return (va - vb) * dir || ((b.row.last_active || 0) - (a.row.last_active || 0));
                    });
                    const size = Math.min(100, Math.max(1, +p.get('size') || 30)), page = Math.max(1, +p.get('page') || 1);
                    return { stats_available: !NOSTATS, tracking_enabled: !NOSTATS && !STATSOFF, total: list.length, page, size, users: list.slice((page - 1) * size, page * size).map(rowOut) };
                }
                function userDetail(token) {
                    const u = byTok[token];
                    if (!u) return { status: 404, data: { error: 'Not found' } };
                    const g = {};
                    if (!NOSTATS) {
                        u.vod.forEach(v => {
                            const a = g['vod|' + v.title] || (g['vod|' + v.title] = { title: v.title, kind: 'vod', seconds: 0, episodes: 0, episodes_done: 0, first_at: v.first_at, last_at: v.last_at, eps: [] });
                            a.seconds += v.seconds; if (v.seconds >= 120 || v.completed) a.episodes++; if (v.completed) a.episodes_done++;
                            a.first_at = Math.min(a.first_at, v.first_at); a.last_at = Math.max(a.last_at, v.last_at);
                            a.eps.push({ episode: v.episode, seconds: v.seconds, completed: v.completed, last_at: v.last_at });
                        });
                        u.live.forEach(v => { g['live|' + v.title] = { title: v.title, kind: 'live', seconds: v.seconds, episodes: 0, episodes_done: 0, first_at: v.first_at, last_at: v.last_at, eps: [] }; });
                    }
                    const showsOut = Object.values(g).sort((a, b) => b.last_at - a.last_at);
                    showsOut.forEach(s => s.eps.sort((a, b) => coll.compare(a.episode, b.episode)));
                    const daily = days(60).map(day => ({ day, seconds: NOSTATS ? 0 : (u.daily[day] || 0) }));
                    return ok({
                        user: rowOut(u), shows: showsOut, daily,
                        shares: NOSTATS ? [] : clone(u.shares.slice(0, 100)).map(s => { delete s.sharer_token; return s; }),
                        requests: clone(requests.filter(r => r.user_token === token).sort((a, b) => b.created_at - a.created_at)),
                        history: clone(u.history.slice(0, 300))
                    });
                }
                function sharesList(p) {
                    const ch = p.get('channel') || '', src = p.get('source') || '';
                    let list = NOSTATS ? [] : shares.filter(s => (!ch || s.channel === ch) && (!src || (s.sources[src] || 0) > 0));
                    const size = Math.min(100, Math.max(1, +p.get('size') || 30)), page = Math.max(1, +p.get('page') || 1);
                    const out = list.slice((page - 1) * size, page * size).map(s => {
                        const o = clone(s), u = byTok[s.sharer_token];
                        o.sharer_identity = u ? u.row.identity : s.sharer_token.slice(0, 12); o.sharer_type = u ? u.row.type : 'unknown';
                        return o;
                    });
                    return { total: list.length, page, size, shares: out };
                }
                function requestsList(p) {
                    const status = p.get('status') || '', q = (p.get('q') || '').toLowerCase(), sort = p.get('sort') || 'new';
                    const dup = {};
                    requests.forEach(r => { [r.tmdb_id ? 't:' + r.tmdb_id : null, 'n:' + normName(r.name)].forEach(k => { if (k) (dup[k] || (dup[k] = new Set())).add(r.id); }); });
                    const enrich = r => {
                        const u = byTok[r.user_token], ids = new Set();
                        [r.tmdb_id ? 't:' + r.tmdb_id : null, 'n:' + normName(r.name)].forEach(k => { if (k && dup[k]) dup[k].forEach(id => ids.add(id)); });
                        return Object.assign(clone(r), { identity: u ? u.row.identity : r.user_token.slice(0, 12), user_type: u ? u.row.type : 'unknown', dup_count: ids.size, wait_days: Math.floor((NOW - r.created_at) / DAY) });
                    };
                    let list = requests.map(enrich).filter(r => !q || [r.name, r.aka, r.identity].some(x => String(x || '').toLowerCase().indexOf(q) >= 0));
                    const counts = reqCounts(list);
                    delete counts.total;
                    if (status) list = list.filter(r => r.status === status);
                    const open = r => (r.status === 'pending' || r.status === 'need_info') ? 1 : 0;
                    if (sort === 'old') list.sort((a, b) => a.created_at - b.created_at);
                    else if (sort === 'hot') list.sort((a, b) => b.dup_count - a.dup_count || b.created_at - a.created_at);
                    else list.sort((a, b) => open(b) - open(a) || b.created_at - a.created_at);
                    return { counts, requests: list.slice(0, 500) };
                }

                async function handle(path, method, body, signal) {
                    await sleep(SLOW ? 20000 : 120 + Math.random() * 380, signal);
                    const url = new URL(path, location.origin), p = url.searchParams, route = url.pathname;
                    const tok = method === 'POST' && route === '/api/requests/admin' ? (body && body.admin) : adminToken;
                    if (tok === 'bad' || (F403_ON && route.indexOf(F403_ON) >= 0)) return { status: 403, data: { error: 'Forbidden' } };
                    const failRate = FAIL_ON ? (route.indexOf(FAIL_ON) >= 0 ? (FAIL || 1) : 0) : FAIL;
                    if (failRate && Math.random() < failRate) return { status: 500, data: { error: 'Mock 随机故障' } };
                    if (method === 'GET') {
                        if (route === '/api/admin/overview') return ok(overview());
                        if (route === '/api/admin/users') return ok(usersList(p));
                        if (route === '/api/admin/user') return userDetail(p.get('token'));
                        if (route === '/api/admin/shares') return ok(sharesList(p));
                        if (route === '/api/admin/requests') return ok(requestsList(p));
                    } else if (method === 'POST') {
                        body = body || {};
                        if (route === '/api/admin/ban') {
                            const u = byTok[body.token]; if (!u) return { status: 400, data: { error: 'Missing token' } };
                            u.row.banned = !!body.banned; u.row.banned_at = body.banned ? Date.now() : null;
                            return ok({ ok: true, banned: u.row.banned });
                        }
                        if (route === '/api/requests/admin') {
                            const i = requests.findIndex(r => r.id === body.id); if (i < 0) return { status: 400, data: { error: 'Bad request' } };
                            if (body.action === 'delete') { const u = byTok[requests[i].user_token]; if (u) u.row.requests--; requests.splice(i, 1); return ok({ ok: true, deleted: true }); }
                            Object.assign(requests[i], { status: body.status, fulfill_link: String(body.fulfill_link || ''), fulfill_note: String(body.fulfill_note || ''), updated_at: Date.now() });
                            return ok({ ok: true });
                        }
                        if (route === '/api/admin/requests/bulk') {
                            const ids = new Set((body.ids || []).slice(0, 200).map(String)); let changed = 0;
                            const hit = r => ids.has(String(r.id)) && (!body.expect || r.status === body.expect);   // expect：只改仍处于该状态的行
                            if (body.action === 'delete') {
                                for (let i = requests.length - 1; i >= 0; i--) if (hit(requests[i])) { const u = byTok[requests[i].user_token]; if (u) u.row.requests--; requests.splice(i, 1); changed++; }
                            } else requests.forEach(r => {
                                if (!hit(r)) return;
                                r.status = body.action; r.updated_at = Date.now(); changed++;
                                if (body.fulfill_link != null) r.fulfill_link = String(body.fulfill_link);
                                if (body.fulfill_note != null) r.fulfill_note = String(body.fulfill_note);
                            });
                            return ok({ ok: true, changed });
                        }
                    }
                    return { status: 404, data: { error: 'Not found' } };
                }
                console.info('[admin mock] 已生成 ' + users.length + ' 个用户 / ' + shares.length + ' 条分享 / ' + requests.length + ' 条求片');
                return { handle };
            }
            if (MOCK_ON) MOCK = createMock();

            app.mount('#app');
        })();
    </script>
