                    aiBenchState(n) {
                        const b = this.ai.data && this.ai.data.bench; if (!b) return '';
                        if (b.running === n) return '测评中…';
                        return b.queue.includes(n) ? '排队中' : '';
                    },
                    aiCanPrimary(m, role) {
                        if (!m.roles.includes(aiCap(role)) || m.gone || m.deprecated || !this.ai.data) return false;
                        const base = this.aiBaseOf(this.ai.data);
                        return aiSingle(role) ? base[role] !== m.name : base[role][0] !== m.name;
                    },
                    aiToggleSel(n, on) { const s = Object.assign({}, this.ai.sel); if (on) s[n] = true; else delete s[n]; this.ai.sel = s; },
                    aiSortBy(k) {
                        if (this.ai.sort === k) this.ai.order = this.ai.order === 'desc' ? 'asc' : 'desc';
                        else { this.ai.sort = k; this.ai.order = (k === 'price' || k === 'name') ? 'asc' : 'desc'; }
                    },
                    // 选模型的下拉：只给这个用途能用、还没选上、没下架的；按这个用途的分数排
                    aiRoleOptions(role) {
                        const d = this.ai.data; if (!d) return [];
                        const cur = aiSingle(role) ? [] : this.ai.draft[role];
                        const sc = m => { const g = this.aiGradeOf(m.name, role); return g ? +g.score : -1; };
                        const pk = m => aiPriceKey(m) == null ? 1e9 : aiPriceKey(m);
                        return d.models.filter(m => m.roles.includes(aiCap(role)) && !m.gone && !cur.includes(m.name))
                            // 评论审核:够用(文字分 ≥ 60)的里便宜的在前;其余按分数
                            .sort(role === 'review' ? (a, b) => ((sc(b) >= 60) - (sc(a) >= 60)) || (pk(a) - pk(b)) || (sc(b) - sc(a)) : (a, b) => (sc(b) - sc(a)) || (pk(a) - pk(b)));
                    },
                    aiOptLabel(m, role) {
                        const g = this.aiGradeOf(m.name, role), dd = daysUntil(m.deprecation);
                        return [aiShortName(m.name), role === 'asr' ? '' : (g ? g.letter + ' 级' + (m.grade && m.grade.estimated ? '(按同系列估计)' : '') : '未测评'), this.aiPriceShort(m),
                            m.deprecated ? '已过下架日期' : (dd != null && dd <= 30 ? dd + ' 天后下架' : ''), m.paidOnly ? '需付费版' : ''].filter(Boolean).join(' · ');
                    },
                    // 服务器只收模型列表里有、没下架的
                    aiSavable(n) { const m = this.aiByName[n]; return !!m && !m.gone; },
                    aiSlotWarn(n) {
                        const m = this.aiByName[n];
                        if (!m) return '模型列表里没有，会被跳过';
                        if (m.gone) return '已下架，会被跳过';
                        if (m.deprecated) return '过了下架日期，会被跳过';
                        const dd = daysUntil(m.deprecation);
                        if (dd != null && dd <= 30) return dd + ' 天后下架';
                        return '';
                    },
                    aiRecFor(role) {
                        const rec = (this.ai.data && this.ai.data.recommended) || {}, out = [];
                        if (role === 'text') { if (rec.text) out.push({ k: 'r', label: '最好', name: rec.text }); if (rec.value && rec.value !== rec.text) out.push({ k: 'v', label: '性价比', name: rec.value }); }
                        else if (rec[role]) out.push({ k: 'r', label: role === 'review' ? '够用里最便宜' : '最好', name: rec[role] });
                        return out;
                    },
                    // 已保存的顺序 vs 实际在跑的顺序(服务器会跳过下架/过期的，再在后面补默认兜底)
                    aiEffNote(role) {
                        const d = this.ai.data; if (!d) return null;
                        const eff = d.effective[role], base = this.aiBaseOf(d)[role];
                        const why = n => { const m = this.aiByName[n]; return !m ? '不在模型列表里' : m.gone ? '已下架' : m.deprecated ? '过了下架日期' : '暂时不可用'; };
                        if (aiSingle(role)) {
                            if (!eff || eff === base) return null;
                            return { warn: true, chain: aiShortName(eff), why: base ? '已保存的 ' + aiShortName(base) + ' ' + why(base) + '，改用默认' : '' };
                        }
                        if (!Array.isArray(eff) || JSON.stringify(eff) === JSON.stringify(base)) return null;
                        const dropped = base.filter(n => !eff.includes(n)), extra = eff.filter(n => !base.includes(n));
                        const L = [];
                        if (dropped.length) L.push('跳过 ' + dropped.map(n => aiShortName(n) + '(' + why(n) + ')').join('、'));
                        if (extra.length) L.push('最后 ' + extra.length + ' 个是自动补上的默认兜底');
                        if (!dropped.length && !extra.length) L.push('顺序和保存的不一样');
                        return { warn: dropped.length > 0, chain: eff.length ? eff.map(aiShortName).join(' → ') : '(没有可用的模型)', why: L.join('；') };
                    },
                    aiMove(role, i, dir) {
                        const l = this.ai.draft[role].slice(), j = i + dir;
                        if (j < 0 || j >= l.length) return;
                        const t = l[i]; l[i] = l[j]; l[j] = t;
                        this.ai.draft[role] = l;
                    },
                    aiRemove(role, i) { const l = this.ai.draft[role].slice(); l.splice(i, 1); this.ai.draft[role] = l; },
                    aiAdd(role, e) {
                        const v = e.target.value; e.target.value = '';
                        const r = K.AI_ROLES.find(x => x.id === role), l = this.ai.draft[role];
                        if (v && !l.includes(v) && l.length < r.max) this.ai.draft[role] = l.concat([v]);
                    },
                    aiUseRec(role, n) {
                        if (aiSingle(role)) { this.ai.draft[role] = n; return; }
                        const r = K.AI_ROLES.find(x => x.id === role);
                        this.ai.draft[role] = [n].concat(this.ai.draft[role].filter(x => x !== n)).slice(0, r.max);
                    },
                    aiDiscard() { if (this.ai.baseJson) this.ai.draft = JSON.parse(this.ai.baseJson); },
                    // settings 类接口(force)保存后草稿以服务器为准；refresh / bench 不动正在编辑的草稿
                    async aiPost(path, body, okMsg) {
                        const d = aiNorm(await api(path, { method: 'POST', body }));
                        this.aiApply(d, path === '/api/admin/ai/settings');
                        if (okMsg) this.toast(okMsg, 'ok');
                        if (Array.isArray(d.warnings)) d.warnings.slice(0, 3).forEach(w => this.toast(String(w), 'err'));   // 保存成功但有提醒(如过了下架日期)
                        return d;
                    },
                    async aiSave() {
                        const dr = this.ai.draft;
                        if (!dr.text.length) { this.toast('文字找片至少要选一个模型', 'err'); return; }
                        if (!dr.image.length) { this.toast('截图找片至少要选一个模型', 'err'); return; }
                        if (!dr.asr) { this.toast('语音转文字要选一个模型', 'err'); return; }
                        const withReview = this.aiRoles.some(r => r.id === 'review');
                        // 已下架 / 列表里没有的服务器不收 → 保存时去掉；只是过了下架日期的可以存(实际会跳过)
                        const all = [].concat(dr.text, dr.image, [dr.asr], withReview && dr.review ? [dr.review] : []).filter((n, i, a) => a.indexOf(n) === i);
                        const gone = all.filter(n => !this.aiSavable(n)), skip = all.filter(n => this.aiSavable(n) && /会被跳过/.test(this.aiSlotWarn(n)));
                        const body = { text: dr.text.filter(this.aiSavable).slice(0, 4), image: dr.image.filter(this.aiSavable).slice(0, 3), asr: dr.asr };
                        if (!this.aiSavable(dr.asr)) { this.toast('语音模型 ' + aiShortName(dr.asr) + ' 已下架，换一个再保存', 'err'); return; }
                        if (withReview) {
                            if (dr.review && !this.aiSavable(dr.review)) { this.toast('评论审核模型 ' + aiShortName(dr.review) + ' 已下架，换一个再保存', 'err'); return; }
                            body.review = dr.review || '';   // 空 = 用默认
                        }
                        if (!body.text.length || !body.image.length) { this.toast((body.text.length ? '截图' : '文字') + '找片去掉已下架的就没有模型了，先添加一个', 'err'); return; }
                        if (gone.length || skip.length) {
                            const L = [];
                            if (gone.length) L.push('这些已下架，会从列表里去掉：\n' + gone.map(aiShortName).join('、'));
                            if (skip.length) L.push('这些过了下架日期，实际会被跳过：\n' + skip.map(aiShortName).join('、'));
                            const ok = await this.ask({ title: '有模型不能用', message: L.join('\n\n') + '\n\n照样保存？', ok: '保存' });
                            if (!ok) return;
                        }
                        this.ai.saving = true;
                        try { await this.aiPost('/api/admin/ai/settings', body, '已保存，马上生效'); }
                        catch (e) { if (e.code !== 'auth') this.toast('保存失败：' + e.message, 'err'); }
                        finally { this.ai.saving = false; }
                    },
                    async aiReset() {
                        const df = (this.ai.data && this.ai.data.defaults) || {};
                        const ok = await this.ask({
                            title: '恢复推荐',
                            message: '清掉保存过的选择，回到默认推荐：\n文字找片：' + (df.text || []).map(aiShortName).join(' → ') + '\n截图找片：' + (df.image || []).map(aiShortName).join(' → ') + '\n语音转文字：' + aiShortName(df.asr) + (df.review ? '\n评论审核：' + aiShortName(df.review) : '') + (this.aiDirty ? '\n\n「正在使用」里没保存的修改也会丢掉。' : ''),
                            ok: '恢复推荐'
                        });
                        if (!ok) return;
                        this.ai.saving = true;
                        try { await this.aiPost('/api/admin/ai/settings', { reset: true }, '已恢复默认推荐'); }
                        catch (e) { if (e.code !== 'auth') this.toast('恢复失败：' + e.message, 'err'); }
                        finally { this.ai.saving = false; }
                    },
                    // 表格里的快捷键：把它放到第一位并立刻保存(只改这一个用途)
                    async aiSetPrimary(role, m) {
                        const base = this.aiBaseOf(this.ai.data), r = K.AI_ROLES.find(x => x.id === role);
                        if (role !== 'asr') base[role] = base[role].filter(this.aiSavable);   // 已下架的服务器不收，顺手去掉
                        const val = role === 'asr' ? m.name : [m.name].concat(base[role].filter(n => n !== m.name)).slice(0, r.max);
                        const ok = await this.ask({
                            title: role === 'asr' ? '设为语音模型' : '设为' + r.label + '主模型',
                            message: role === 'asr' ? '语音转文字改用「' + aiShortName(m.name) + '」？' : '把「' + aiShortName(m.name) + '」放到' + r.label + '的第一位？\n新顺序：' + val.map(aiShortName).join(' → ') + (base[role].length >= r.max && !base[role].includes(m.name) ? '\n(已满 ' + r.max + ' 个，最后一个 ' + aiShortName(base[role][r.max - 1]) + ' 会被挤掉)' : '') + (this.aiDirty ? '\n\n「正在使用」里没保存的修改会丢掉。' : ''),
                            ok: '保存'
                        });
                        if (!ok) return;
                        this.ai.saving = true;
                        try { await this.aiPost('/api/admin/ai/settings', { [role]: val }, aiShortName(m.name) + ' 已设为' + (role === 'asr' ? '语音模型' : r.label + '主模型')); }
                        catch (e) { if (e.code !== 'auth') this.toast('保存失败：' + e.message, 'err'); }
                        finally { this.ai.saving = false; }
                    },
                    async aiRefresh() {
                        this.ai.busy = Object.assign({}, this.ai.busy, { refresh: true });
                        try {
                            const before = new Set(((this.ai.data && this.ai.data.models) || []).map(m => m.name));
                            const d = await this.aiPost('/api/admin/ai/refresh', {});
                            const added = d.models.filter(m => !before.has(m.name)).length;
                            if (d.catalogErr) this.toast('同步失败：' + d.catalogErr, 'err');
                            else this.toast('模型列表已更新，共 ' + d.models.filter(m => !m.gone).length + ' 个可用' + (added ? '，新增 ' + added + ' 个' : ''), 'ok');
                        } catch (e) {
                            if (e.code !== 'auth') this.toast('同步失败：' + e.message, 'err');
                        } finally { const b = Object.assign({}, this.ai.busy); delete b.refresh; this.ai.busy = b; }
                    },
                    async aiBench(names) {
                        names = (names || []).filter(n => this.aiByName[n] && this.aiCanBench(this.aiByName[n]) && !this.aiBenchState(n)).slice(0, 6);
                        if (!names.length) { this.toast('选中的模型都已经在测评队列里了', 'err'); return; }
                        if (names.length > 1) {
                            const ok = await this.ask({ title: '测评 ' + names.length + ' 个模型', message: names.map(aiShortName).join('、') + '\n\n按顺序一个一个跑，每个都会用掉一些今日调用次数。', ok: '开始测评' });
                            if (!ok) return;
                        }

                        try {
                            await this.aiPost('/api/admin/ai/bench', { names }, names.length > 1 ? '已排进测评队列：' + names.length + ' 个' : '开始测评 ' + aiShortName(names[0]));
                            this.ai.sel = {};
                        } catch (e) {
                            if (e.code !== 'auth') this.toast('测评没开始：' + e.message, 'err');
                        } finally { const b = Object.assign({}, this.ai.busy); delete b.bench; this.ai.busy = b; }
                    },

                    // ---------- 用户详情抽屉 ----------
                    openUser(token, seed) {
                        if (!token) return;
                        if (!this.dw.open) lastFocus = document.activeElement;
                        Object.assign(this.dw, { open: true, token, seed: seed ? { identity: seed.identity, type: seed.type, banned: seed.banned } : null, data: null, error: '', sub: 'shows', exp: {} });
                        this.loadUser();
                        this.$nextTick(() => { if (this.$refs.dwClose) this.$refs.dwClose.focus(); if (this.$refs.dwBody) this.$refs.dwBody.scrollTop = 0; });
                    },
                    loadUser() {
                        const token = this.dw.token;
                        return runLoad('dw', this.dw, signal => api('/api/admin/user?token=' + encodeURIComponent(token), { signal })).then(d => {
                            if (!d) return;
                            ['shows', 'daily', 'shares', 'requests', 'history'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
                            if (!d.user) { this.dw.data = null; this.dw.error = '没有找到这个用户的数据'; return; }
                            if (!d.shows.length && d.history.length) this.dw.sub = 'history';

                    },
                    closeUser() {
                        if (RUNS.dw) RUNS.dw.ctrl.abort();
                        this.dw.open = false;
                        const f = lastFocus; lastFocus = null;
                        if (f && document.contains(f) && f.focus) this.$nextTick(() => f.focus());
                    },
                    toggleExp(s) { const k = s.kind + '|' + s.title; this.dw.exp[k] = !this.dw.exp[k]; },
                    async toggleBan() {
                        const u = this.dw.data && this.dw.data.user; if (!u || this.dw.banBusy) return;
                        const to = !u.banned;
                        const ok = await this.ask({
                            title: to ? '封禁用户' : '解封用户',
                            message: to ? '封禁「' + u.identity + '」？\n被封后该用户打开网站会被锁屏，历史同步、求片也会被拒绝。' : '解封「' + u.identity + '」？',
                            ok: to ? '封禁' : '解封', danger: to
                        });
                        if (!ok) return;
                        this.dw.banBusy = true;
                        try {
                            const res = await api('/api/admin/ban', { method: 'POST', body: { token: u.token, banned: to } });
                            if (!res || !res.ok) throw new ApiError((res && res.error) || '操作失败', 'fail');
                            const b = res.banned != null ? !!res.banned : to;
                            u.banned = b; u.banned_at = b ? Date.now() : null;
                            const row = this.us.data && this.us.data.users.find(x => x.token === u.token);
                            if (row) { row.banned = b; row.banned_at = u.banned_at; }
                            this.ov.stale = true;
                            this.toast((b ? '已封禁 ' : '已解封 ') + u.identity, 'ok');
                        } catch (e) {
                            if (e.code !== 'auth') this.toast('操作失败：' + e.message, 'err');
                        } finally { this.dw.banBusy = false; }
                    },

                    // ---------- 求片处理 ----------
                    toggleReq(r) {
                        if (this.rq.open === r.id) { this.rq.open = null; return; }
                        if (!this.rq.drafts[r.id]) this.rq.drafts[r.id] = { link: r.fulfill_link || '', note: r.fulfill_note || '', suggest: '' };
                        this.rq.open = r.id;
                    },
                    useTpl(r, t) { const d = this.rq.drafts[r.id]; if (!d) return; d.note = t.text; d.suggest = t.st; },
                    bumpCount(from, to) {
                        const c = this.rq.data && this.rq.data.counts; if (!c) return;
                        if (from && c[from] != null) c[from] = Math.max(0, c[from] - 1);
                        if (to && c[to] != null) c[to] = c[to] + 1;
                        if (!to && c.all != null) c.all = Math.max(0, c.all - 1);
                    },
                    async reqAct(r, action) {
                        if (this.rq.busy[r.id]) return;
                        if (action === 'delete') {
                            const ok = await this.ask({ title: '删除求片', message: '删除「' + r.name + '」这条求片？删除后用户在「我的求片」里也看不到了。', ok: '删除', danger: true });
                            if (!ok) return;
                        }
                        const d = this.rq.drafts[r.id] || { link: r.fulfill_link || '', note: r.fulfill_note || '' };
                        // 旧接口 POST /api/requests/admin：令牌在 body.admin(兼容)，同时也带 X-Admin-Token 头
                        const body = action === 'delete'
                            ? { admin: adminToken, id: r.id, action: 'delete' }
                            : { admin: adminToken, id: r.id, status: action, fulfill_link: (d.link || '').trim(), fulfill_note: (d.note || '').trim() };
                        this.rq.busy[r.id] = true;
                        try {
                            const res = await api('/api/requests/admin', { method: 'POST', body });
                            if (!res || !res.ok) throw new ApiError((res && res.error) || '操作失败', 'fail');
                            const old = r.status;
                            if (action === 'delete') {
                                this.rq.data.requests = this.rq.data.requests.filter(x => x.id !== r.id);
                                delete this.rq.sel[r.id];
                                this.bumpCount(old, null);
                                this.toast('已删除「' + r.name + '」', 'ok');
                            } else {
                                r.status = action; r.fulfill_link = body.fulfill_link; r.fulfill_note = body.fulfill_note; r.updated_at = Date.now();
                                if (this.isMoved(r)) delete this.rq.sel[r.id];   // 变暗卡退出勾选，免得被批量操作顺手改掉
                                if (old !== action) this.bumpCount(old, action);
                                this.toast('「' + r.name + '」→ ' + STATUS_LABEL[action], 'ok');
                            }
                            if (this.rq.open === r.id) this.rq.open = null;
                            this.ov.stale = true;
                        } catch (e) {
                            if (e.code !== 'auth') this.toast('操作失败：' + e.message, 'err');
                        } finally { this.rq.busy[r.id] = false; }
                    },
                    toggleAll(on) {
                        const sel = {};
                        if (on) this.selectableReqs.forEach(r => { sel[r.id] = true; });
                        this.rq.sel = sel;
                    },
                    clearSel() { this.rq.sel = {}; },
                    async bulk(action) {
                        const list = this.rq.data ? this.rq.data.requests : [];
                        const byKey = {}; list.forEach(r => { byKey[String(r.id)] = r; });
                        const ids = this.selIds.map(k => (byKey[k] ? byKey[k].id : k));
                        if (!ids.length || this.rq.bulkBusy) return;
                        // 带上当前分类作为期望状态：服务器只改仍处于该状态的行(这期间被单条处理/别处改过的不动)
                        const expect = this.rq.status !== 'all' ? this.rq.status : '';
                        const label = action === 'delete' ? '删除' : '标记为「' + STATUS_LABEL[action] + '」';
                        const ok = await this.ask({ title: '批量操作', message: '把' + (expect ? '「' + STATUS_LABEL[expect] + '」里' : '') + '选中的 ' + ids.length + ' 条求片' + label + '？' + (action === 'delete' ? '\n删除不可恢复。' : ''), ok: action === 'delete' ? '删除' : '确定', danger: action === 'delete' });
                        if (!ok) return;
                        this.rq.bulkBusy = true;
                        let changed = 0;
                        try {
                            for (let i = 0; i < ids.length; i += 200) {   // 接口每次最多 200 条
                                const body = { ids: ids.slice(i, i + 200), action };
                                if (expect) body.expect = expect;
                                if (action !== 'delete') {
                                    if (this.rq.bulkLink.trim()) body.fulfill_link = this.rq.bulkLink.trim();
                                    if (this.rq.bulkNote.trim()) body.fulfill_note = this.rq.bulkNote.trim();
                                }
                                const res = await api('/api/admin/requests/bulk', { method: 'POST', body });
                                if (!res || !res.ok) throw new ApiError((res && res.error) || '操作失败', 'fail');
                                changed += +res.changed || 0;
                            }
                            const skipped = ids.length - changed;
                            this.toast('已' + label + ' ' + changed + ' 条' + (skipped > 0 ? '（' + skipped + ' 条状态已变化或已删除，未改动）' : ''), 'ok');
                            this.rq.sel = {}; this.rq.bulkNote = ''; this.rq.bulkLink = '';
                            this.ov.stale = true;
                            this.loadRequests();
                        } catch (e) {
                            if (e.code !== 'auth') { this.toast('批量操作失败：' + e.message + (changed ? '（已成功 ' + changed + ' 条）' : ''), 'err'); if (changed) this.loadRequests(); }
                        } finally { this.rq.bulkBusy = false; }
                    },

                    // ---------- 通用：确认框 / toast / 复制 / 键盘 ----------
                    ask(o) {
                        if (cfResolve) cfResolve(false);
                        Object.assign(this.cf, { open: true, title: o.title || '确认', message: o.message || '', ok: o.ok || '确定', danger: !!o.danger });
                        this.cfPrevFocus = document.activeElement;
                        this.$nextTick(() => { const b = o.danger ? this.$refs.cfCancel : this.$refs.cfOk; if (b) b.focus(); });
                        return new Promise(res => { cfResolve = res; });
                    },
                    cfDone(v) {
                        this.cf.open = false;
                        const r = cfResolve; cfResolve = null;

                            const hit = r => ids.has(String(r.id)) && (!body.expect || r.status === body.expect);   // expect：只改仍处于该状态的行
                            if (body.action === 'delete') {
                                for (let i = requests.length - 1; i >= 0; i--) if (hit(requests[i])) { const u = byTok[requests[i].user_token]; if (u) u.row.requests--; requests.splice(i, 1); changed++; }
                            } else requests.forEach(r => {
                                if (!hit(r)) return;
                                r.status = body.action; r.updated_at = Date.now(); changed++;
                                if (body.fulfill_link != null) r.fulfill_link = String(body.fulfill_link);
                                if (body.fulfill_note != null) r.fulfill_note = String(body.fulfill_note);
                            });
                            return ok({ ok: true, changed });
                        }
                    }
                    return { status: 404, data: { error: 'Not found' } };
                }
                console.info('[admin mock] 已生成 ' + users.length + ' 个用户 / ' + shares.length + ' 条分享 / ' + requests.length + ' 条求片');
                return { handle };
            }
            if (MOCK_ON) MOCK = createMock();

            app.mount('#app');
        })();
    </script>
</body>
