<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="dark">
    <title>站长后台 · DongguaTV</title>
    <link rel="icon" href="icon.png">
    <script src="libs/js/vue.global.prod.min.js"></script>
    <style>
        /* 🎨 主题令牌：深色后台，主色沿用站点红 #e50914；文字/徽章色均按深色底 ≥4.5:1 对比度挑选 */
        :root {
            color-scheme: dark;
            --accent: #e50914;
            --accent-soft: rgba(229, 9, 20, .16);
            --bg: #0c0c0f;
            --panel: #15151a;
            --panel-2: #1c1c23;
            --panel-3: #262630;
            --line: rgba(255, 255, 255, .08);
            --line-2: rgba(255, 255, 255, .14);
            --text: #ececf1;
            --text-2: #c2c2cd;
            --muted: #9a9aa8;
            --link: #8cc4ff;
            --focus: #8cc4ff;
            --good: #86efac;
            --warn: #fcd34d;
            --serious: #fdba74;
            --bad: #fca5a5;
            /* 图表系列色(dataviz 参考调色板·深色档)：单系列图只用一种色，标题点名含义 */
            --series-1: #3987e5;
            --series-2: #199e70;
            --radius: 12px;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; min-height: 100vh; }
        body.lock { overflow: hidden; }
        h1, h2, h3, h4, p, ul, ol { margin: 0; padding: 0; }
        ul, ol { list-style: none; }
        button, input, select, textarea { font: inherit; color: inherit; }
        a { color: var(--link); }
        code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
        :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
        .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
        .muted { color: var(--muted); }
        .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .wrapany { overflow-wrap: anywhere; word-break: break-word; }
        .boot { color: var(--muted); text-align: center; padding: 30vh 16px 0; }

        /* 🔘 按钮 */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; padding: 6px 14px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text); cursor: pointer; white-space: nowrap; text-decoration: none; font-size: 13px; line-height: 1.2; transition: background .15s, border-color .15s; }
        .btn:hover:not(:disabled) { background: var(--panel-3); border-color: rgba(255, 255, 255, .24); }
        .btn:disabled { opacity: .45; cursor: not-allowed; }
        .btn-sm { min-height: 30px; padding: 4px 11px; font-size: 12.5px; }
        .btn-xs { min-height: 24px; padding: 2px 8px; font-size: 12px; border-radius: 7px; }
        .btn-icon { min-width: 34px; padding: 4px 8px; font-size: 15px; }
        .btn-block { width: 100%; }
        .btn-ghost { background: transparent; }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
        .btn-primary:hover:not(:disabled) { background: #f6121e; border-color: #f6121e; }
        .btn-ok { background: #4ade80; border-color: #4ade80; color: #052e16; font-weight: 600; }
        .btn-ok:hover:not(:disabled) { background: #6ee7a0; border-color: #6ee7a0; }
        .btn-warn { background: #fbbf24; border-color: #fbbf24; color: #3a2600; font-weight: 600; }
        .btn-warn:hover:not(:disabled) { background: #fcd34d; border-color: #fcd34d; }
        .btn-danger { background: #dc2626; border-color: #dc2626; color: #fff; font-weight: 600; }
        .btn-danger:hover:not(:disabled) { background: #ef4444; border-color: #ef4444; }
        .btn-danger-ghost { background: transparent; border-color: rgba(248, 113, 113, .5); color: var(--bad); }
        .btn-danger-ghost:hover:not(:disabled) { background: rgba(248, 113, 113, .12); border-color: rgba(248, 113, 113, .7); }
        .btn.suggest { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--focus); }
        .linkish { background: none; border: 0; padding: 0; color: var(--text); font-weight: 600; cursor: pointer; text-align: left; overflow-wrap: anywhere; word-break: break-word; }
        .linkish:hover { text-decoration: underline; color: #fff; }

        /* ⌨️ 表单控件 */
        input[type=text], input[type=search], input[type=password], select, textarea { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 9px; color: var(--text); padding: 7px 11px; min-height: 36px; outline: none; width: 100%; min-width: 0; }
        textarea { resize: vertical; line-height: 1.45; }
        select { width: auto; cursor: pointer; }
        input:focus, select:focus, textarea:focus { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(140, 196, 255, .18); }
        input::placeholder, textarea::placeholder { color: #8a8a97; }
        input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; margin: 0; }
        input[type=checkbox]:disabled { cursor: not-allowed; opacity: .45; }

        /* 🏷️ 徽章 */
        .badge { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; line-height: 1; padding: 4px 8px; border-radius: 999px; white-space: nowrap; font-weight: 500; background: rgba(255, 255, 255, .08); color: var(--text-2); }
        .t-independent { background: rgba(185, 168, 255, .15); color: #d4caff; }
        .t-primary { background: rgba(251, 191, 36, .15); color: #fcd34d; }
        .t-airport { background: rgba(96, 165, 250, .16); color: #a9d0ff; }
        .t-unknown { background: rgba(255, 255, 255, .08); color: #c8c8d2; }
        .b-ban { background: rgba(248, 113, 113, .18); color: var(--bad); }
        .b-live { background: rgba(25, 158, 112, .2); color: #7ee2bd; }
        .b-hot { background: rgba(229, 9, 20, .2); color: #ffb3b8; }
        .b-ch { background: rgba(140, 196, 255, .12); color: #b8dbff; }
        .b-est { background: rgba(253, 186, 116, .14); color: var(--serious); }
        .b-mock { background: #7c3aed; color: #fff; font-weight: 700; letter-spacing: .5px; }
        .s-pending { background: rgba(252, 211, 77, .15); color: var(--warn); }
        .s-need_info { background: rgba(253, 186, 116, .15); color: var(--serious); }
        .s-fulfilled { background: rgba(134, 239, 172, .14); color: var(--good); }
        .s-rejected { background: rgba(255, 255, 255, .09); color: #cfcfd8; }

        /* 🔑 登录 */
        .login { min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 14vh 16px 40px; }
        .login-card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; text-align: center; box-shadow: 0 20px 60px rgba(0, 0, 0, .45); }
        .login-logo { font-size: 34px; margin-bottom: 6px; }
        .login-card h1 { font-size: 22px; margin-bottom: 6px; }
        .login-card p.muted { font-size: 13px; margin-bottom: 18px; }
        .login-card input { margin-bottom: 12px; text-align: center; }
        .login-err { color: var(--bad); margin-top: 12px; font-size: 13px; }
        .mock-note { margin-top: 14px; font-size: 12px; color: #d8c8ff; background: rgba(124, 58, 237, .16); border-radius: 8px; padding: 8px; }

        /* 🧭 顶栏 + 分区 tab */
        .top { position: sticky; top: 0; z-index: 30; background: rgba(12, 12, 15, .97); border-bottom: 1px solid var(--line); }
        .top-in { max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
        .brand { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .tabs { display: flex; gap: 4px; flex: 1; min-width: 0; }
        .tabs button { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 9px; border: 1px solid transparent; background: transparent; color: var(--text-2); cursor: pointer; font-size: 14px; white-space: nowrap; }
        .tabs button:hover { background: var(--panel-2); color: var(--text); }
        .tabs button.on { background: var(--accent-soft); border-color: rgba(229, 9, 20, .5); color: #fff; font-weight: 600; }
        .tab-count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 11px; line-height: 18px; text-align: center; font-weight: 700; }
        .top-acts { display: flex; gap: 6px; }
        @media (max-width: 820px) {
            .top-in { flex-wrap: wrap; gap: 8px 10px; padding: 8px 12px; }
            .brand { flex: 1; }
            .tabs { order: 3; flex: 1 1 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .tabs button { justify-content: center; padding: 7px 2px; font-size: 13px; gap: 4px; }
            .hide-narrow { display: none; }
        }

        .wrap { max-width: 1280px; margin: 0 auto; padding: 16px 16px 90px; }
        @media (max-width: 480px) { .wrap { padding: 12px 12px 90px; } }
        .sec > * + * { margin-top: 14px; }

        /* 📦 面板 */
        .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
        .panel.p0 { padding: 0; }
        .panel-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-bottom: 10px; }
        .panel-h h2 { font-size: 15px; font-weight: 700; }
        .panel-h .sp { flex: 1; }
        .panel + .panel { margin-top: 14px; }
        .grid-2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; align-items: start; }
        .grid-2 > .col > .panel + .panel { margin-top: 14px; }
        @media (max-width: 960px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }

        /* ⚠️ 提示条 / 加载态 */
        .err-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: rgba(248, 113, 113, .1); border: 1px solid rgba(248, 113, 113, .38); color: #fecaca; padding: 10px 12px; border-radius: 10px; }
        .err-banner .eb-msg { flex: 1; min-width: 160px; overflow-wrap: anywhere; }
        .note-banner { border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; }
        .note-banner.warn { background: rgba(252, 211, 77, .09); border: 1px solid rgba(252, 211, 77, .3); color: #fde68a; }
        .note-banner.info { background: rgba(140, 196, 255, .07); border: 1px solid rgba(140, 196, 255, .2); color: #cfe5ff; }
        .loading { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; padding: 46px 12px; color: var(--text-2); text-align: center; }
        .spin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .15); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
        .topline { height: 2px; border-radius: 2px; overflow: hidden; background: rgba(255, 255, 255, .05); position: relative; }
        .topline::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent); animation: slide 1s ease-in-out infinite; }
        .dim { opacity: .55; transition: opacity .2s; }
        .empty { color: var(--muted); text-align: center; padding: 40px 12px; }
        .empty-s { color: var(--muted); font-size: 13px; padding: 12px 0; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slide { 0% { left: -30%; } 100% { left: 100%; } }
        @keyframes fade { from { opacity: 0; } }
        @keyframes slidein { from { transform: translateX(40px); opacity: 0; } }
        @keyframes pop { from { transform: translateY(8px); opacity: 0; } }

        /* 📊 KPI 卡 */
        .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
        @media (max-width: 1180px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
        @media (max-width: 760px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .kpi { display: flex; flex-direction: column; justify-content: flex-start; align-items: stretch; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; color: var(--text); }
        button.kpi { cursor: pointer; transition: border-color .15s, background .15s; }
        button.kpi:hover { border-color: rgba(255, 255, 255, .22); background: #18181e; }
        .kpi .k-l { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 4px; }
        .kpi .k-l .go { margin-left: auto; color: var(--muted); font-size: 12px; }
        .kpi .k-v { font-size: 22px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; line-height: 1.25; }
        .kpi .k-s { font-size: 11.5px; color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; line-height: 1.4; }
        .kpi.warn { border-color: rgba(252, 211, 77, .35); }
        .kpi.warn .k-v { color: var(--warn); }
        .since { font-size: 12.5px; color: var(--muted); }

        /* 📈 图表 */
        .chart-cap { font-size: 12px; color: var(--text-2); margin: 6px 0 2px; }
        .chart { position: relative; width: 100%; touch-action: pan-y; border-radius: 8px; }
        .chart svg { display: block; overflow: visible; }
        .chart .grid line { stroke: rgba(255, 255, 255, .07); stroke-width: 1; }
        .chart .base { stroke: rgba(255, 255, 255, .22); stroke-width: 1; }
        .chart text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
        .chart .hl { fill: rgba(255, 255, 255, .06); }
        .chart path.dimmed { opacity: .45; }
        .chart-tip { position: absolute; transform: translate(-50%, -100%); background: #24242c; border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 9px; font-size: 12px; line-height: 1.5; color: var(--text); white-space: nowrap; pointer-events: none; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); z-index: 5; }
        .chart-tip .tt-h { color: var(--text-2); font-size: 11.5px; }

        /* ▬ 横向条形 */
        .hbars li { display: grid; grid-template-columns: minmax(64px, 7.5em) minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
        .hbars .hb-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
        .hbars .hb-track { height: 10px; border-radius: 0 4px 4px 0; background: rgba(255, 255, 255, .04); overflow: hidden; }
        .hbars .hb-track i { display: block; height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
        .hbars .hb-v { font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap; min-width: 3em; text-align: right; }

        /* 📋 表格 */
        .table-wrap { overflow-x: auto; }
        .tbl { width: 100%; border-collapse: collapse; }
        .tbl th { font-weight: 600; color: var(--text-2); font-size: 12px; text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; background: var(--panel); }
        .tbl th.num { text-align: right; }
        .tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
        .tbl tbody tr:last-child td { border-bottom: 0; }
        .tbl-compact td { padding: 7px 8px; }
        .tbl-compact th { padding: 7px 8px; }
        .c-rank { width: 28px; color: var(--muted); font-variant-numeric: tabular-nums; }
        .ts-title { overflow-wrap: anywhere; }
        .minibar { height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .05); margin-top: 5px; overflow: hidden; }
        .minibar i { display: block; height: 100%; background: var(--series-1); border-radius: 2px; }
        .th-sort { background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; display: inline-flex; gap: 3px; align-items: center; white-space: nowrap; }
        .th-sort:hover { color: #fff; }
        .th-sort .arr { color: var(--muted); font-size: 11px; width: 10px; }
        .th-sort.on { color: #fff; }
        .th-sort.on .arr { color: var(--accent); }
        .u-row { cursor: pointer; }
        .u-row:hover td { background: rgba(255, 255, 255, .025); }
        .u-row.banned td { background: rgba(248, 113, 113, .05); }
        .c-user { min-width: 200px; max-width: 300px; }
        .c-last { min-width: 150px; max-width: 240px; }
        .clip2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
        .u-badges { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-top: 4px; font-size: 12px; }

        /* 🛠 工具栏 */
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .toolbar .search { flex: 1 1 240px; min-width: 0; }
        .toolbar .count { font-size: 13px; white-space: nowrap; }
        .sortbox { display: inline-flex; gap: 4px; }
        @media (max-width: 640px) {
            .toolbar .search { flex: 1 1 100%; }
            .toolbar select { flex: 1 1 calc(50% - 8px); }
            .sortbox { flex: 1 1 calc(50% - 8px); }
            .sortbox select { flex: 1; min-width: 0; }
        }
        .seg { display: flex; flex-wrap: wrap; gap: 6px; }
        .seg button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel); color: var(--text-2); cursor: pointer; font-size: 13px; }
        .seg button:hover { color: var(--text); background: var(--panel-2); }
        .seg button.on { background: var(--accent-soft); border-color: rgba(229, 9, 20, .55); color: #fff; font-weight: 600; }
        .seg .seg-n { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
        .seg button.on .seg-n { color: #ffd2d5; }
        .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); cursor: pointer; white-space: nowrap; }

        /* 📄 分页 */
        .pager { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
        .pager .pg-info { color: var(--text-2); font-size: 13px; min-width: 70px; text-align: center; font-variant-numeric: tabular-nums; }

        /* 📱 手机卡片 */
        .cards { display: flex; flex-direction: column; gap: 8px; }
        .ucard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; cursor: pointer; min-width: 0; }
        .ucard:hover { border-color: rgba(255, 255, 255, .2); }
        .ucard.banned { border-color: rgba(248, 113, 113, .35); background: #1a1416; }
        .uc-h { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .uc-name { font-weight: 600; overflow-wrap: anywhere; word-break: break-word; min-width: 0; }
        .uc-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin: 10px 0 6px; }
        .uc-stats div { background: var(--panel-2); border-radius: 8px; padding: 6px 8px; min-width: 0; }
        .uc-stats b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
        .uc-stats span { font-size: 11.5px; color: var(--muted); }
        .uc-line { font-size: 12.5px; margin-top: 4px; overflow-wrap: anywhere; color: var(--text-2); }
        .uc-line.muted { color: var(--muted); }

        /* 🔗 分享 */
        .chips { display: flex; flex-wrap: wrap; gap: 5px; }
        .chip { border: 1px solid var(--line-2); background: var(--panel-2); color: var(--text-2); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; text-align: left; }
        .chip:hover { color: var(--text); border-color: rgba(255, 255, 255, .3); }
        .chip-s { display: inline-flex; gap: 4px; align-items: center; border-radius: 999px; padding: 2px 8px; font-size: 11.5px; background: rgba(140, 196, 255, .1); color: #c6e1ff; white-space: nowrap; }
        .chip-s b { font-weight: 700; font-variant-numeric: tabular-nums; }
        .chip-pv { background: rgba(185, 168, 255, .12); color: #d9d0ff; }
        .chip-u { background: rgba(134, 239, 172, .1); color: #bdf5d0; white-space: normal; overflow-wrap: anywhere; }
        .sh-content { overflow-wrap: anywhere; }
        .scard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; }
        .scard .sc-top { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .scard .sc-stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--text-2); margin: 6px 0; }
        .scard .sc-stats b { color: var(--text); font-variant-numeric: tabular-nums; }

        /* 📮 求片卡片 */
        .rlist { display: flex; flex-direction: column; gap: 10px; }
        .rcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; transition: opacity .2s, border-color .15s; }
        .rcard.sel { border-color: rgba(229, 9, 20, .55); background: #1a1517; }
        .rcard.moved { opacity: .62; }
        .rc-main { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 12px; padding: 12px; align-items: start; }
        .rc-check { padding-top: 2px; display: flex; }
        .poster { width: 58px; height: 87px; border-radius: 8px; overflow: hidden; background: linear-gradient(160deg, #2a2a35, #15151a); flex: none; display: flex; align-items: center; justify-content: center; }
        .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .poster-ph { font-size: 22px; font-weight: 800; color: rgba(255, 255, 255, .35); }
        .rc-title { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
        .rc-title h3 { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
        .rc-meta { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 12.5px; color: var(--text-2); margin-top: 5px; overflow-wrap: anywhere; }
        .rc-meta .warnc { color: var(--warn); font-weight: 600; }
        .rc-note { margin-top: 6px; font-size: 13px; color: var(--text); background: var(--panel-2); border-radius: 8px; padding: 6px 9px; overflow-wrap: anywhere; }
        .rc-done { margin-top: 6px; font-size: 12.5px; color: var(--text-2); display: flex; flex-wrap: wrap; gap: 3px 10px; overflow-wrap: anywhere; }
        .rc-done a { overflow-wrap: anywhere; word-break: break-all; }
        .rc-done .code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
        .rc-panel { border-top: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #131317; border-radius: 0 0 var(--radius) var(--radius); }
        .fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-2); }
        .rc-acts { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
        .rc-acts .push { margin-left: auto; }
        .rc-links { display: flex; flex-wrap: wrap; gap: 6px; }
        @media (max-width: 560px) {
            .rc-main { grid-template-columns: auto auto minmax(0, 1fr); gap: 10px; padding: 10px; }
            .rc-side { grid-column: 1 / -1; display: flex; justify-content: flex-end; margin-top: -4px; }
            .poster { width: 46px; height: 69px; }
            .rc-acts .push { margin-left: 0; }
        }
        .bulkbar { position: sticky; bottom: 12px; z-index: 20; background: #1f1f27; border: 1px solid rgba(255, 255, 255, .2); border-radius: 14px; padding: 10px 12px; box-shadow: 0 12px 40px rgba(0, 0, 0, .6); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; animation: pop .15s ease-out; }
        .bulkbar .bb-n { font-weight: 700; white-space: nowrap; }
        .bulkbar .bb-in { flex: 1 1 180px; min-width: 0; }
        .bulkbar .bb-acts { display: flex; flex-wrap: wrap; gap: 6px; }
        .bulkbar .bb-tg { display: none; }
        /* 手机：两个可选输入框默认收起，省出屏幕给列表 */
        @media (max-width: 640px) {
            .bulkbar { padding: 8px 10px; gap: 6px; bottom: 8px; }
            .bulkbar .bb-tg { display: inline-flex; margin-left: auto; }
            .bulkbar:not(.extra) .bb-in { display: none; }
            .bulkbar .bb-in { flex: 1 1 100%; }
            .bulkbar .bb-acts .btn { padding: 4px 9px; }
        }

        /* 🗂 用户详情抽屉 */
        .dw-mask { position: fixed; inset: 0; background: rgba(0, 0, 0, .58); z-index: 60; animation: fade .15s; }
        .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(780px, 100%); background: #111115; border-left: 1px solid var(--line-2); z-index: 61; display: flex; flex-direction: column; box-shadow: -20px 0 50px rgba(0, 0, 0, .5); animation: slidein .2s ease-out; }
        .dw-h { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-bottom: 1px solid var(--line); }
        .dw-id { flex: 1; min-width: 0; }
        .dw-id h2 { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; word-break: break-word; }
        .dw-line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12.5px; color: var(--text-2); }
        .dw-line code { color: var(--text-2); background: var(--panel-2); padding: 2px 6px; border-radius: 6px; }
        .dw-acts { display: flex; gap: 6px; flex: none; }
        .dw-b { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px 48px; }
        .dw-b > * + * { margin-top: 14px; }
        .metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
        @media (max-width: 700px) { .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 420px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        .metric { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
        .metric .m-l { font-size: 11.5px; color: var(--text-2); }
        .metric .m-v { font-size: 15px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
        .metric .m-s { font-size: 11px; color: var(--muted); margin-top: 1px; overflow-wrap: anywhere; }
        .now-watch { font-size: 13px; color: var(--text-2); overflow-wrap: anywhere; }
        .subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
        .subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--text-2); padding: 8px 12px; cursor: pointer; white-space: nowrap; font-size: 13.5px; }
        .subtabs button:hover { color: var(--text); }
        .subtabs button.on { color: #fff; border-bottom-color: var(--accent); font-weight: 600; }
        .subtabs .n { color: var(--muted); font-size: 12px; margin-left: 3px; font-variant-numeric: tabular-nums; }
        .dlist > li { border-bottom: 1px solid var(--line); }
        .dlist > li:last-child { border-bottom: 0; }
        .show-row { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 2px 8px; width: 100%; background: none; border: 0; padding: 10px 4px; text-align: left; cursor: pointer; color: var(--text); border-radius: 8px; }
        .show-row:hover:not(:disabled) { background: rgba(255, 255, 255, .03); }
        .show-row:disabled { cursor: default; }
        .show-row .caret { color: var(--muted); grid-row: 1 / 3; padding-top: 1px; }
        .show-row .st { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
        .show-row .sd { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; text-align: right; }
        .show-row .ss { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
        .show-row .minibar { grid-column: 2 / 4; margin-top: 2px; }
        .eps { width: calc(100% - 24px); margin: 0 0 10px 24px; border-collapse: collapse; font-size: 12.5px; }
        .eps td { padding: 5px 6px; border-top: 1px solid var(--line); color: var(--text-2); }
        .eps td:first-child { color: var(--text); overflow-wrap: anywhere; }
        .eps .ok { color: var(--good); }
        .hist-item, .ds-item, .dr-item { padding: 10px 2px; }
        .hi-top { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
        .hi-name { font-weight: 600; overflow-wrap: anywhere; }
        .hi-when { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
        .progress { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .07); overflow: hidden; margin: 7px 0 5px; }
        .progress i { display: block; height: 100%; background: var(--series-1); border-radius: 3px; }
        .ds-item .sc-stats { display: flex; flex-wrap: wrap; gap: 3px 14px; font-size: 12.5px; color: var(--text-2); margin: 6px 0; }
        .ds-item .sc-stats b { color: var(--text); }
        .ds-item .chips + .chips { margin-top: 5px; }
        .lbl-s { font-size: 11.5px; color: var(--muted); margin-right: 2px; }

        /* 💬 确认框 / toast */
        .modal-mask { position: fixed; inset: 0; background: rgba(0, 0, 0, .62); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .12s; }
        .modal { width: 100%; max-width: 420px; background: #18181e; border: 1px solid var(--line-2); border-radius: 14px; padding: 20px; box-shadow: 0 24px 70px rgba(0, 0, 0, .6); animation: pop .15s ease-out; }
        .modal h3 { font-size: 16px; margin-bottom: 8px; }
        .modal p { color: var(--text-2); font-size: 13.5px; overflow-wrap: anywhere; white-space: pre-line; }
        .modal-acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
        .toasts { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; width: max-content; max-width: calc(100vw - 32px); pointer-events: none; }
        .toast { background: #26262f; border: 1px solid var(--line-2); color: var(--text); padding: 9px 14px; border-radius: 10px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); animation: pop .18s ease-out; overflow-wrap: anywhere; }
        .toast.ok { border-color: rgba(134, 239, 172, .45); }
        .toast.ok::before { content: "✓ "; color: var(--good); font-weight: 700; }
        .toast.err { border-color: rgba(248, 113, 113, .55); background: #2c1c1f; }
        .toast.err::before { content: "⚠ "; color: var(--bad); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="boot">正在加载后台…</div>
        <noscript><div class="boot">后台需要启用 JavaScript</div></noscript>
    </div>

    <!-- ===================== 模板：加载/错误态(任何加载都会在 15 秒内结束) ===================== -->
    <script type="text/x-template" id="tpl-load">
        <div v-if="st.error || st.loading" class="ls">
            <div v-if="st.error" class="err-banner" role="alert">
                <span aria-hidden="true">⚠</span>
                <span class="eb-msg">{{ st.error }}</span>
                <button type="button" class="btn btn-sm" :disabled="st.loading" @click="$emit('retry')">{{ st.loading ? '重试中…' : '重试' }}</button>
            </div>
            <div v-if="st.loading && !has" class="loading" role="status">
                <span class="spin" aria-hidden="true"></span>
                <span>{{ label || '加载中' }}…</span>
                <span v-if="secs >= 3" class="muted">已等待 {{ secs }} 秒（超过 15 秒自动放弃）</span>
            </div>
            <div v-else-if="st.loading" class="topline" role="status" aria-label="正在刷新"></div>
        </div>
    </script>

    <!-- ===================== 模板：柱状图(纯内联 SVG，按容器实际像素宽绘制) ===================== -->
    <script type="text/x-template" id="tpl-chart">
        <div class="chart" ref="box" tabindex="0" role="group" aria-roledescription="柱状图" :aria-label="summary"
             @pointermove="onMove" @pointerdown="onMove" @pointerleave="onLeave" @keydown="onKey" @focus="onFocus" @blur="onBlur">
            <svg ref="svg" :width="w" :height="height" :viewBox="'0 0 ' + w + ' ' + height" aria-hidden="true" focusable="false">
                <g class="grid"><line v-for="t in ticks" :key="'g' + t.k" :x1="pad.l" :x2="w - pad.r" :y1="t.y" :y2="t.y"></line></g>
                <g><text v-for="t in ticks" :key="'t' + t.k" :x="pad.l - 6" :y="t.y" dy="0.32em" text-anchor="end">{{ t.label }}</text></g>
                <rect v-if="cur >= 0" class="hl" :x="pad.l + cur * step" :y="pad.t" :width="step" :height="innerH"></rect>
                <g :style="{ fill: color }"><path v-for="(b, i) in bars" :key="i" :d="b.d" :class="{ dimmed: cur >= 0 && cur !== i }"></path></g>
                <line class="base" :x1="pad.l" :x2="w - pad.r" :y1="pad.t + innerH" :y2="pad.t + innerH"></line>
                <g><text v-for="x in xlabels" :key="'x' + x.i" :x="x.x" :y="height - 5" text-anchor="middle">{{ x.label }}</text></g>
            </svg>
            <div v-if="tip" class="chart-tip" :style="{ left: tip.x + 'px', top: tip.y + 'px' }" aria-hidden="true">
                <div class="tt-h">{{ tip.it.full || tip.it.label }}</div>
                <div v-for="(l, j) in tip.it.tip" :key="j">{{ l }}</div>
            </div>
            <div class="sr-only" aria-live="polite">{{ liveText }}</div>
        </div>
    </script>

    <!-- ===================== 模板：横向条形 ===================== -->
    <script type="text/x-template" id="tpl-hbars">
        <ul v-if="items && items.length" class="hbars">
            <li v-for="it in items" :key="it.label" :title="it.label + '：' + fmtv(it.value) + (it.extra ? '（' + it.extra + '）' : '')">
                <span class="hb-l">{{ it.label }}</span>
                <span class="hb-track" aria-hidden="true"><i :style="{ width: w(it.value), background: color }"></i></span>
                <span class="hb-v">{{ fmtv(it.value) }}</span>
            </li>
        </ul>
        <p v-else class="empty-s">{{ empty || '暂无数据' }}</p>
    </script>

    <!-- ===================== 模板：分页 ===================== -->
    <script type="text/x-template" id="tpl-pager">
        <nav v-if="pages > 1" class="pager" aria-label="分页">
            <button type="button" class="btn btn-sm hide-narrow" :disabled="page <= 1" @click="$emit('go', 1)" aria-label="第一页">«</button>
            <button type="button" class="btn btn-sm" :disabled="page <= 1" @click="$emit('go', page - 1)">‹ 上一页</button>
            <span class="pg-info">{{ page }} / {{ pages }}</span>
            <button type="button" class="btn btn-sm" :disabled="page >= pages" @click="$emit('go', page + 1)">下一页 ›</button>
            <button type="button" class="btn btn-sm hide-narrow" :disabled="page >= pages" @click="$emit('go', pages)" aria-label="最后一页">»</button>
        </nav>
    </script>

    <!-- ===================== 模板：主应用 ===================== -->
    <script type="text/x-template" id="tpl-app">
        <div class="app">
            <!-- 🔑 登录 -->
            <main v-if="!authed" class="login">
                <form class="login-card" @submit.prevent="login">
                    <div class="login-logo" aria-hidden="true">🛡️</div>
                    <h1>站长后台</h1>
                    <p class="muted">输入管理员令牌（ADMIN_TOKEN）登录</p>
                    <label class="sr-only" for="adm-tk">ADMIN_TOKEN</label>
                    <input id="adm-tk" ref="tokenInput" v-model="tokenInput" type="password" autocomplete="current-password" placeholder="ADMIN_TOKEN" :disabled="loginBusy">
                    <button class="btn btn-primary btn-block" type="submit" :disabled="loginBusy">{{ loginBusy ? '验证中…' : '登录' }}</button>
                    <p v-if="loginErr" class="login-err" role="alert">{{ loginErr }}</p>
                    <p v-if="mock" class="mock-note">MOCK 模式：任意令牌都能登录（输入 bad 模拟令牌错误）。数据全部为本地生成，不连服务器。</p>
                </form>
            </main>

            <template v-else>
                <!-- 🧭 顶栏 -->
                <header class="top">
                    <div class="top-in">
                        <div class="brand"><span aria-hidden="true">🛡️</span>站长后台<span v-if="mock" class="badge b-mock">MOCK</span></div>
                        <nav class="tabs" aria-label="后台分区">
                            <button v-for="t in K.TABS" :key="t.id" type="button" :class="{ on: tab === t.id }" :aria-current="tab === t.id ? 'page' : null" @click="setTab(t.id)">
                                <span aria-hidden="true">{{ t.icon }}</span>{{ t.label }}<span v-if="t.id === 'requests' && pendingCount" class="tab-count" :aria-label="pendingCount + ' 条待处理'">{{ pendingCount > 99 ? '99+' : pendingCount }}</span>
                            </button>
                        </nav>
                        <div class="top-acts">
                            <button type="button" class="btn btn-sm" :disabled="curLoading" @click="refresh" title="刷新当前分区">↻<span class="hide-narrow">&nbsp;刷新</span></button>
                            <button type="button" class="btn btn-sm" @click="logout">退出</button>
                        </div>
                    </div>
                </header>

                <main class="wrap">
                    <!-- ======================= 📊 概览 ======================= -->
                    <section v-show="tab === 'overview'" class="sec" aria-label="概览">
                        <load-state :st="ov" :has="!!ov.data" @retry="loadOverview"></load-state>
                        <template v-if="ov.data">
                            <div v-if="!ov.data.stats_available" class="note-banner warn">观看 / 分享统计不可用：需要服务器使用 CACHE_TYPE=sqlite（且未设置 STATS_DISABLE=1）。下方观看与分享数字会是空的。</div>
                            <div v-else-if="ovStatsOff" class="note-banner warn">观看/分享统计已关闭(STATS_DISABLE=1)：服务器不再记录新的观看与分享，下方这两类数字不会再增长；去掉该环境变量并重启服务后恢复。</div>
                            <p class="since">
                                <template v-if="ov.data.tracking_since">实测观看统计始于 {{ ov.data.tracking_since }}（按真实播放秒数累计：画面在走、页面在前台或画中画、4 小时内有操作才计时），此前的观看没有计入<template v-if="ovStatsOff">；统计关闭后的观看同样没有计入</template>。</template>
                                <template v-else-if="ovStatsOff">没有实测观看数据（统计已关闭，见上方提示）。</template>
                                <template v-else>还没有实测观看数据：用户更新到新版播放页后开始累计。</template>
                                <span v-if="ov.at"> · 数据于 {{ fmtRel(ov.at) }}刷新</span>
                            </p>

                            <div class="kpis">
                                <component :is="k.go ? 'button' : 'div'" v-for="k in kpis" :key="k.k" class="kpi" :class="k.tone" :type="k.go ? 'button' : null" @click="k.go && goKpi(k.go)">
                                    <div class="k-l">{{ k.label }}<span v-if="k.go" class="go" aria-hidden="true">›</span></div>
                                    <div class="k-v">{{ k.value }}</div>
                                    <div class="k-s">{{ k.sub }}</div>
                                </component>
                            </div>

                            <div class="panel">
                                <div class="panel-h">
                                    <h2>近 30 天</h2>
                                    <span class="muted">合计 {{ fmtDur(dailySum.seconds) }} · 日均 {{ fmtDur(dailySum.seconds / 30) }} · 单日最多 {{ dailySum.peakUsers }} 人在看</span>
                                </div>
                                <div class="chart-cap">每日观看时长（小时）</div>
                                <bar-chart v-if="tab === 'overview'" :items="hoursItems" :height="170" color="var(--series-1)" unit="h" label="近 30 天每日观看小时" :active="ovHover" @hover="ovHover = $event"></bar-chart>
                                <div class="chart-cap" style="margin-top:10px">每日观看人数</div>
                                <bar-chart v-if="tab === 'overview'" :items="usersItems" :height="104" color="var(--series-2)" integer label="近 30 天每日观看人数" :active="ovHover" @hover="ovHover = $event"></bar-chart>
                            </div>

                            <div class="grid-2">
                                <div class="col">
                                    <div class="panel">
                                        <div class="panel-h"><h2>热门剧 Top 15</h2><span class="muted">近 30 天有人看过</span></div>
                                        <table v-if="topShows.length" class="tbl tbl-compact">
                                            <thead><tr><th class="c-rank">#</th><th>剧名</th><th class="num">时长</th><th class="num">观众</th><th class="num">集数</th></tr></thead>
                                            <tbody>
                                                <tr v-for="(s, i) in topShows" :key="s.title">
                                                    <td class="c-rank">{{ i + 1 }}</td>
                                                    <td><div class="ts-title">{{ s.title }}</div><div class="minibar" aria-hidden="true"><i :style="{ width: s.pct + '%' }"></i></div></td>
                                                    <td class="num">{{ fmtDur(s.seconds) }}</td>
                                                    <td class="num">{{ fmtNum(s.users) }}</td>
                                                    <td class="num">{{ fmtNum(s.episodes) }}</td>
                                                </tr>
                                            </tbody>
                                        </table>
                                        <p v-else class="empty-s">近 30 天还没有观看记录</p>
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="panel">
                                        <div class="panel-h"><h2>分享带来的打开</h2><span class="muted">按打开时的 App 来源</span></div>
                                        <hbars :items="sourceItems" color="var(--series-1)" empty="还没有通过分享链接打开的记录"></hbars>
                                        <p class="sub" v-if="ov.data.shares">共 {{ fmtNum(ov.data.shares.opens) }} 次打开 · 去重访客 {{ fmtNum(ov.data.shares.uniq_visitors) }} · 带来登录 {{ fmtNum(ov.data.shares.logins) }} · 社交平台抓取预览 {{ fmtNum(ov.data.shares.previews) }} 次</p>
                                    </div>
                                    <div class="panel">
                                        <div class="panel-h"><h2>分享渠道</h2><span class="muted">用户点的分享按钮</span></div>
                                        <hbars :items="channelItems" color="var(--series-1)" empty="还没有分享"></hbars>
                                    </div>
                                    <div class="panel">
                                        <div class="panel-h"><h2>直播 Top</h2><span class="muted">按观看时长</span></div>
                                        <hbars :items="liveItems" color="var(--series-2)" :fmt="fmtDur" empty="还没有直播观看记录"></hbars>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </section>

                    <!-- ======================= 👥 用户 ======================= -->
                    <section v-show="tab === 'users'" class="sec" aria-label="用户">
                        <div class="toolbar">
                            <input class="search" type="search" v-model="us.qInput" placeholder="🔍 搜索 邮箱 / 独立密码 / token" aria-label="搜索用户" @keydown.enter="flushUserSearch">
                            <select v-model="us.type" aria-label="用户类型">
                                <option v-for="o in typeOptions" :key="o[0]" :value="o[0]">{{ o[1] }}</option>
                            </select>
                            <select v-model="us.status" aria-label="用户状态">
                                <option v-for="o in K.USER_STATUS" :key="o[0]" :value="o[0]">{{ o[1] }}</option>
                            </select>
                            <span class="sortbox">
                                <select v-model="us.sort" aria-label="排序字段">
                                    <option v-for="o in K.USER_SORTS" :key="o[0]" :value="o[0]">按{{ o[1] }}</option>
                                </select>
                                <button type="button" class="btn btn-icon" @click="us.order = us.order === 'desc' ? 'asc' : 'desc'" :title="us.order === 'desc' ? '当前降序，点击切换为升序' : '当前升序，点击切换为降序'" :aria-label="us.order === 'desc' ? '降序（点击切换升序）' : '升序（点击切换降序）'">{{ us.order === 'desc' ? '↓' : '↑' }}</button>
                            </span>
                            <span v-if="us.data" class="muted count">共 {{ fmtNum(us.data.total) }} 人</span>
                            <button v-if="userFiltered" type="button" class="btn btn-sm btn-ghost" @click="resetUserFilters">清除筛选</button>
                        </div>

                        <load-state :st="us" :has="!!us.data" @retry="loadUsers"></load-state>
                        <div v-if="us.data && us.data.stats_available === false" class="note-banner warn">实测观看统计不可用（需 CACHE_TYPE=sqlite），观看时长/集数会显示为 0。</div>
                        <div v-else-if="us.data && us.data.tracking_enabled === false" class="note-banner warn">观看/分享统计已关闭(STATS_DISABLE=1)：观看时长/集数/分享数停留在关闭前，不再增长。</div>

                        <template v-if="us.data">
                            <div v-if="!us.data.users.length" class="empty">没有匹配的用户</div>

                            <!-- 桌面：表格 -->
                            <div v-else-if="!narrow" class="panel p0 table-wrap" :class="{ dim: us.loading }">
                                <table class="tbl">
                                    <thead>
                                        <tr>
                                            <th>用户</th>
                                            <th v-for="c in K.USER_COLS" :key="c.sort" :class="{ num: c.num }" :aria-sort="us.sort === c.sort ? (us.order === 'desc' ? 'descending' : 'ascending') : null">
                                                <button type="button" class="th-sort" :class="{ on: us.sort === c.sort }" @click="sortBy(c.sort)">{{ c.label }}<span class="arr" aria-hidden="true">{{ us.sort === c.sort ? (us.order === 'desc' ? '↓' : '↑') : '↕' }}</span></button>
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr v-for="u in us.data.users" :key="u.token" class="u-row" :class="{ banned: u.banned }" @click="openUser(u.token, u)">
                                            <td class="c-user">
                                                <button type="button" class="linkish" @click.stop="openUser(u.token, u)">{{ u.identity }}</button>
                                                <div class="u-badges">
                                                    <span class="badge" :class="'t-' + u.type">{{ typeLabel(u.type) }}</span>
                                                    <span v-if="u.banned" class="badge b-ban">⛔ 已封禁</span>
                                                    <span v-if="u.last_device" class="muted">{{ u.last_device }}</span>
                                                </div>
                                            </td>
                                            <td class="num">
                                                <div>{{ fmtDur(u.watch_seconds) }}</div>
                                                <div v-if="u.live_seconds" class="sub">直播 {{ fmtDur(u.live_seconds) }}</div>
                                                <div v-if="u.active_days_30" class="sub">30 天里 {{ u.active_days_30 }} 天在看</div>
                                            </td>
                                            <td class="num"><div>{{ fmtNum(u.episodes) }}</div><div class="sub">看完 {{ fmtNum(u.episodes_done) }}</div></td>
                                            <td class="num"><div>{{ fmtNum(u.shows) }}</div><div v-if="u.legacy_shows" class="sub" title="旧版同步历史里的剧数">旧同步 {{ u.legacy_shows }}</div></td>
                                            <td class="c-last">
                                                <template v-if="u.last_title">
                                                    <div class="clip2">《{{ u.last_title }}》{{ u.last_episode }}</div>
                                                    <div class="sub" :title="fmtAbs(u.last_watch_at)">{{ fmtRel(u.last_watch_at) }}</div>
                                                </template>
                                                <span v-else class="muted">—</span>
                                            </td>
                                            <td>
                                                <div :title="fmtAbs(u.last_active)">{{ fmtRel(u.last_active) }}</div>
                                                <div class="sub" :title="fmtAbs(u.last_login)">登录 {{ fmtRel(u.last_login) }}</div>
                                            </td>
                                            <td class="num">
                                                <div>{{ fmtNum(u.share_opens) }}</div>
                                                <div class="sub" :title="'分享 ' + u.shares + ' 次，带来打开 ' + u.share_opens + ' 次，带来登录 ' + u.share_logins + ' 人'">{{ u.shares }} 次 · 登 {{ u.share_logins }}</div>
                                            </td>
                                            <td class="num">{{ u.requests ? fmtNum(u.requests) : '—' }}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- 手机：卡片 -->
                            <div v-else class="cards" :class="{ dim: us.loading }">
                                <article v-for="u in us.data.users" :key="u.token" class="ucard" :class="{ banned: u.banned }" tabindex="0" role="button" :aria-label="'查看 ' + u.identity + ' 的详情'" @click="openUser(u.token, u)" @keydown.enter.prevent="openUser(u.token, u)" @keydown.space.prevent="openUser(u.token, u)">
                                    <div class="uc-h">
                                        <span class="uc-name">{{ u.identity }}</span>
                                        <span class="badge" :class="'t-' + u.type">{{ typeLabel(u.type) }}</span>
                                        <span v-if="u.banned" class="badge b-ban">⛔ 已封禁</span>
                                    </div>
                                    <div class="uc-stats">
                                        <div><b>{{ fmtDur(u.watch_seconds) }}</b><span>观看时长</span></div>
                                        <div><b>{{ fmtNum(u.episodes) }}</b><span>集 · 看完 {{ u.episodes_done }}</span></div>
                                        <div><b>{{ fmtNum(u.shows) }}</b><span>部剧</span></div>
                                    </div>
                                    <div v-if="u.last_title" class="uc-line">在看《{{ u.last_title }}》{{ u.last_episode }} · {{ fmtRel(u.last_watch_at) }}</div>
                                    <div class="uc-line muted">活跃 {{ fmtRel(u.last_active) }} · 登录 {{ fmtRel(u.last_login) }}<template v-if="u.last_device"> · {{ u.last_device }}</template></div>
                                    <div v-if="u.shares || u.requests" class="uc-line muted"><template v-if="u.shares">分享 {{ u.shares }} 次 · 带来打开 {{ u.share_opens }} · 登录 {{ u.share_logins }}</template><template v-if="u.shares && u.requests"> · </template><template v-if="u.requests">求片 {{ u.requests }}</template></div>
                                </article>
                            </div>

                            <pager :page="us.data.page || us.page" :pages="userPages" @go="goUsersPage"></pager>
                        </template>
                    </section>

                    <!-- ======================= 📮 求片 ======================= -->
                    <section v-show="tab === 'requests'" class="sec" aria-label="求片">
                        <div class="seg" role="group" aria-label="按状态筛选">
                            <button v-for="s in K.REQ_TABS" :key="s.id" type="button" :class="{ on: rq.status === s.id }" :aria-pressed="rq.status === s.id" @click="setReqStatus(s.id)">
                                {{ s.label }}<span class="seg-n">{{ reqCounts[s.id] != null ? fmtNum(reqCounts[s.id]) : '' }}</span>
                            </button>
                        </div>
                        <div class="toolbar">
                            <input class="search" type="search" v-model="rq.qInput" placeholder="🔍 搜索 片名 / 又名 / 提交人" aria-label="搜索求片" @keydown.enter="flushReqSearch">
                            <select v-model="rq.sort" aria-label="排序">
                                <option value="new">最新提交</option>
                                <option value="old">最早提交</option>
                                <option value="hot">最多人想看</option>
                            </select>
                            <label v-if="rq.data && rq.data.requests.length" class="chk"><input type="checkbox" :checked="allSelected" :indeterminate.prop="someSelected" @change="toggleAll($event.target.checked)"> 全选</label>
                            <span v-if="rq.data" class="muted count">显示 {{ rq.data.requests.length }} 条</span>
                        </div>

                        <load-state :st="rq" :has="!!rq.data" @retry="loadRequests"></load-state>

                        <template v-if="rq.data">
                            <div v-if="!rq.data.requests.length" class="empty">{{ rq.status === 'pending' && !rq.q ? '没有待处理的求片 🎉' : '没有匹配的求片' }}</div>
                            <div v-else class="rlist" :class="{ dim: rq.loading }">
                                <article v-for="r in rq.data.requests" :key="r.id" class="rcard" :class="{ sel: rq.sel[r.id] && !isMoved(r), moved: isMoved(r) }">
                                    <div class="rc-main">
                                        <label class="rc-check" :title="isMoved(r) ? '刚处理过、已不在「' + statusLabel(rq.status) + '」里，不参与批量操作' : null"><input type="checkbox" v-model="rq.sel[r.id]" :disabled="isMoved(r)" :aria-label="'选择 ' + r.name"></label>
                                        <div class="poster">
                                            <img v-if="posterUrl(r.poster) && !rq.badPoster[r.id]" :src="posterUrl(r.poster)" alt="" loading="lazy" referrerpolicy="no-referrer" @error="rq.badPoster[r.id] = true">
                                            <span v-else class="poster-ph" aria-hidden="true">{{ (r.name || '?').slice(0, 1) }}</span>
                                        </div>
                                        <div class="rc-body">
                                            <div class="rc-title">
                                                <h3>{{ r.name }}</h3>
                                                <span v-if="r.year" class="muted">({{ r.year }})</span>
                                                <span class="badge" :class="'s-' + r.status">{{ statusIcon(r.status) }} {{ statusLabel(r.status) }}</span>
                                                <span v-if="r.dup_count > 1" class="badge b-hot" :title="'同一部片(同 TMDB 或同名)共被求了 ' + r.dup_count + ' 次'">🔥 {{ r.dup_count }} 人想看</span>
                                            </div>
                                            <div v-if="r.aka || r.cast_info" class="rc-meta">
                                                <span v-if="r.aka">又名：{{ r.aka }}</span>
                                                <span v-if="r.cast_info">演职员：{{ r.cast_info }}</span>
                                            </div>
                                            <div class="rc-meta">
                                                <span>提交人 <button type="button" class="linkish" @click="openUser(r.user_token, { identity: r.identity, type: r.user_type })">{{ r.identity || shortTok(r.user_token) }}</button> <span v-if="r.user_type" class="badge" :class="'t-' + r.user_type">{{ typeLabel(r.user_type) }}</span></span>
                                                <span :title="fmtAbs(r.created_at)">{{ fmtRel(r.created_at) }}提交</span>
                                                <span v-if="r.status === 'pending' || r.status === 'need_info'" :class="{ warnc: waitDays(r) >= 7 }">已等待 {{ waitDays(r) }} 天</span>
                                            </div>
                                            <p v-if="r.note" class="rc-note">“{{ r.note }}”</p>
                                            <div v-if="r.status !== 'pending' || r.fulfill_link || r.fulfill_note" class="rc-done">
                                                <span v-if="r.status !== 'pending'" :title="fmtAbs(r.updated_at)">{{ r.status === 'need_info' ? '退回于' : '处理于' }} {{ fmtRel(r.updated_at) }}</span>
                                                <template v-if="r.fulfill_link">
                                                    <a v-if="safeHref(r.fulfill_link)" :href="safeHref(r.fulfill_link)" target="_blank" rel="noopener noreferrer">{{ r.fulfill_link }}</a>
                                                    <span v-else class="code">{{ r.fulfill_link }}</span>
                                                </template>
                                                <span v-if="r.fulfill_note">说明：{{ r.fulfill_note }}</span>
                                            </div>
                                        </div>
                                        <div class="rc-side">
                                            <button type="button" class="btn btn-sm" :class="{ 'btn-primary': rq.open !== r.id && (r.status === 'pending' || r.status === 'need_info') }" :aria-expanded="rq.open === r.id ? 'true' : 'false'" @click="toggleReq(r)">{{ rq.open === r.id ? '收起' : '处理' }}</button>
                                        </div>
                                    </div>

                                    <div v-if="rq.open === r.id && rq.drafts[r.id]" class="rc-panel">
                                        <div class="rc-links">
                                            <a class="btn btn-xs btn-ghost" :href="tmdbHref(r)" target="_blank" rel="noopener noreferrer">{{ tmdbPage(r) ? 'TMDB 页面' : 'TMDB 搜索' }} ↗</a>
                                            <a class="btn btn-xs btn-ghost" :href="doubanHref(r)" target="_blank" rel="noopener noreferrer">豆瓣搜索 ↗</a>
                                            <button type="button" class="btn btn-xs btn-ghost" @click="copy(r.name, '片名')">复制片名</button>
                                        </div>
                                        <label class="fld">链接（磁力 / 网盘 / 站内播放链接，可留空）
                                            <input type="text" v-model="rq.drafts[r.id].link" placeholder="https://… 或 magnet:…">
                                        </label>
                                        <label class="fld">给用户的说明
                                            <textarea v-model="rq.drafts[r.id].note" rows="2" maxlength="500" placeholder="用户在「我的求片」里能看到这段话"></textarea>
                                        </label>
                                        <div class="chips" aria-label="常用回复">
                                            <button v-for="t in K.REPLY_TEMPLATES" :key="t.text" type="button" class="chip" @click="useTpl(r, t)">{{ t.text }}</button>
                                        </div>
                                        <div class="rc-acts">
                                            <button type="button" class="btn btn-sm btn-ok" :class="{ suggest: rq.drafts[r.id].suggest === 'fulfilled' }" :disabled="!!rq.busy[r.id]" @click="reqAct(r, 'fulfilled')">✓ 已提供</button>
                                            <button type="button" class="btn btn-sm btn-warn" :class="{ suggest: rq.drafts[r.id].suggest === 'need_info' }" :disabled="!!rq.busy[r.id]" @click="reqAct(r, 'need_info')">? 需补充信息</button>
                                            <button type="button" class="btn btn-sm" :class="{ suggest: rq.drafts[r.id].suggest === 'rejected' }" :disabled="!!rq.busy[r.id]" @click="reqAct(r, 'rejected')">✕ 无法提供</button>
                                            <button v-if="r.status !== 'pending'" type="button" class="btn btn-sm btn-ghost" :disabled="!!rq.busy[r.id]" @click="reqAct(r, 'pending')">↺ 改回待处理</button>
                                            <button type="button" class="btn btn-sm btn-danger-ghost push" :disabled="!!rq.busy[r.id]" @click="reqAct(r, 'delete')">删除</button>
                                        </div>
                                    </div>
                                </article>
                            </div>
                        </template>

                        <div v-if="selCount" class="bulkbar" :class="{ extra: rq.bulkExtra }" role="region" aria-label="批量操作">
                            <span class="bb-n">已选 {{ selCount }} 条</span>
                            <button type="button" class="btn btn-xs btn-ghost" @click="clearSel">取消选择</button>
                            <button type="button" class="btn btn-xs btn-ghost bb-tg" :aria-expanded="rq.bulkExtra ? 'true' : 'false'" @click="rq.bulkExtra = !rq.bulkExtra">{{ rq.bulkExtra ? '收起附言' : '附言 / 链接' }}</button>
                            <input class="bb-in" type="text" v-model="rq.bulkNote" placeholder="附带说明（可选）" aria-label="批量附带说明">
                            <input class="bb-in" type="text" v-model="rq.bulkLink" placeholder="附带链接（可选）" aria-label="批量附带链接">
                            <div class="bb-acts">
                                <button type="button" class="btn btn-sm btn-ok" :disabled="rq.bulkBusy" @click="bulk('fulfilled')">✓ 已提供</button>
                                <button type="button" class="btn btn-sm btn-warn" :disabled="rq.bulkBusy" @click="bulk('need_info')">? 需补充</button>
                                <button type="button" class="btn btn-sm" :disabled="rq.bulkBusy" @click="bulk('rejected')">✕ 无法提供</button>
                                <button type="button" class="btn btn-sm btn-ghost" :disabled="rq.bulkBusy" @click="bulk('pending')">↺ 待处理</button>
                                <button type="button" class="btn btn-sm btn-danger-ghost" :disabled="rq.bulkBusy" @click="bulk('delete')">删除</button>
                            </div>
                        </div>
                    </section>

                    <!-- ======================= 🔗 分享 ======================= -->
                    <section v-show="tab === 'shares'" class="sec" aria-label="分享">
                        <div class="toolbar">
                            <select v-model="sh.channel" aria-label="分享渠道">
                                <option value="">全部渠道</option>
                                <option v-for="c in K.CHANNELS" :key="c[0]" :value="c[0]">{{ c[1] }}</option>
                            </select>
                            <select v-model="sh.source" aria-label="打开来源">
                                <option value="">全部打开来源</option>
                                <option v-for="s in sourceOptions" :key="s" :value="s">{{ s }}</option>
                            </select>
                            <span v-if="sh.data" class="muted count">共 {{ fmtNum(sh.data.total) }} 条分享</span>
                        </div>
                        <p class="since">每条分享链接带唯一码：别人点开(真人) 记"打开"并按 App 识别来源；微信/Telegram 等抓取卡片记"预览"；打开后登录/已登录进入记"带来登录"。</p>

                        <load-state :st="sh" :has="!!sh.data" @retry="loadShares"></load-state>
                        <template v-if="sh.data">
                            <div v-if="!sh.data.shares.length" class="empty">没有匹配的分享</div>
                            <div v-else-if="!narrow" class="panel p0 table-wrap" :class="{ dim: sh.loading }">
                                <table class="tbl">
                                    <thead><tr><th>分享人</th><th>内容</th><th>渠道</th><th>时间</th><th class="num">打开 / 去重</th><th class="num">带来登录</th><th>打开来源</th></tr></thead>
                                    <tbody>
                                        <tr v-for="s in sh.data.shares" :key="s.code">
                                            <td class="c-user">
                                                <button type="button" class="linkish" @click="openUser(s.sharer_token, { identity: s.sharer_identity, type: s.sharer_type })">{{ s.sharer_identity || shortTok(s.sharer_token) }}</button>
                                                <div class="u-badges"><span v-if="s.sharer_type" class="badge" :class="'t-' + s.sharer_type">{{ typeLabel(s.sharer_type) }}</span></div>
                                            </td>
                                            <td class="sh-content"><div>{{ s.title }}<span v-if="s.kind === 'live'" class="badge b-live" style="margin-left:6px">直播</span></div><div v-if="s.episode" class="sub">{{ s.episode }}</div></td>
                                            <td><span class="badge b-ch">{{ chLabel(s.channel) }}</span></td>
                                            <td :title="fmtAbs(s.created_at)" style="white-space:nowrap">{{ fmtRel(s.created_at) }}</td>
                                            <td class="num"><div>{{ fmtNum(s.opens) }}</div><div class="sub">去重 {{ fmtNum(s.uniq) }}</div></td>
                                            <td class="num" :title="(s.login_users || []).join('、')">{{ fmtNum(s.logins) }}</td>
                                            <td>
                                                <div class="chips">
                                                    <span v-for="c in topChips(s.sources, 4)" :key="c[0]" class="chip-s">{{ c[0] }} <b>{{ c[1] }}</b></span>
                                                    <span v-for="c in topChips(s.preview_sources, 3)" :key="'p' + c[0]" class="chip-s chip-pv" :title="c[0] + ' 抓取预览卡片 ' + c[1] + ' 次'">预览·{{ c[0] }} <b>{{ c[1] }}</b></span>
                                                    <span v-if="!hasKeys(s.sources) && !hasKeys(s.preview_sources)" class="muted">—</span>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div v-else class="cards" :class="{ dim: sh.loading }">
                                <article v-for="s in sh.data.shares" :key="s.code" class="scard">
                                    <div class="sc-top">
                                        <strong class="wrapany">{{ s.title }}</strong><span v-if="s.episode" class="muted">· {{ s.episode }}</span>
                                        <span v-if="s.kind === 'live'" class="badge b-live">直播</span>
                                        <span class="badge b-ch">{{ chLabel(s.channel) }}</span>
                                    </div>
                                    <div class="sc-stats">
                                        <span>打开 <b>{{ s.opens }}</b>（去重 {{ s.uniq }}）</span><span>带来登录 <b>{{ s.logins }}</b></span><span :title="fmtAbs(s.created_at)">{{ fmtRel(s.created_at) }}</span>
                                    </div>
                                    <div class="chips" v-if="hasKeys(s.sources) || hasKeys(s.preview_sources)">
                                        <span v-for="c in topChips(s.sources, 6)" :key="c[0]" class="chip-s">{{ c[0] }} <b>{{ c[1] }}</b></span>
                                        <span v-for="c in topChips(s.preview_sources, 3)" :key="'p' + c[0]" class="chip-s chip-pv">预览·{{ c[0] }} <b>{{ c[1] }}</b></span>
                                    </div>
                                    <div class="uc-line muted">分享人 <button type="button" class="linkish" @click="openUser(s.sharer_token, { identity: s.sharer_identity, type: s.sharer_type })">{{ s.sharer_identity || shortTok(s.sharer_token) }}</button></div>
                                </article>
                            </div>
                            <pager :page="sh.data.page || sh.page" :pages="sharePages" @go="goSharesPage"></pager>
                        </template>
                    </section>
                </main>
            </template>

            <!-- ======================= 🗂 用户详情抽屉 ======================= -->
            <template v-if="dw.open">
                <div class="dw-mask" @click="closeUser"></div>
                <aside class="drawer" role="dialog" aria-modal="true" :aria-label="'用户详情：' + (dwUser ? dwUser.identity : '')" @keydown="trapTab">
                    <header class="dw-h">
                        <div class="dw-id">
                            <h2>{{ dwUser && dwUser.identity ? dwUser.identity : shortTok(dw.token) }}</h2>
                            <div class="dw-line">
                                <span v-if="dwUser && dwUser.type" class="badge" :class="'t-' + dwUser.type">{{ typeLabel(dwUser.type) }}</span>
                                <span v-if="dwUser && dwUser.banned" class="badge b-ban" :title="dwUser.banned_at ? '封禁于 ' + fmtAbs(dwUser.banned_at) : ''">⛔ 已封禁</span>
                                <code :title="dw.token">{{ shortTok(dw.token, 16) }}</code>
                                <button type="button" class="btn btn-xs" @click="copy(dw.token, ' token')">复制 token</button>
                            </div>
